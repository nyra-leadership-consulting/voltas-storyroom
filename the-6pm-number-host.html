<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Operation: Family Vacation · Facilitator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0c131b; --panel:#141e29; --panel-2:#1b2836; --line:#2a3a4b; --ink:#e8eef4; --muted:#93a4b5; --amber:#f2a93b;
  --red:#c8432b; --green:#2f9a63;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);height:100%}
#app{height:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:clamp(17px,1.7vw,30px);line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.gate{min-height:100%;display:grid;place-items:center;padding:24px}
.gate form{display:grid;gap:12px;width:min(420px,100%)}
.gate input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:20px;text-transform:uppercase;letter-spacing:.1em}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--amber);color:#1a1205;font-size:.8em}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
.stage{min-height:100%;display:grid;grid-template-rows:1fr auto}
.slide{padding:clamp(20px,3.5vw,56px) clamp(20px,4.5vw,72px) 24px;display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);overflow:auto}
.kicker{font-family:var(--mono);color:var(--amber);font-size:.75em;letter-spacing:.06em}
.title{font-size:clamp(40px,5.4vw,92px)}
.h{font-size:clamp(30px,3.4vw,58px)}
.lead{font-size:1.2em;max-width:48ch}
.code{display:inline-flex;align-items:baseline;gap:18px;background:var(--panel);border:2px solid var(--amber);border-radius:16px;padding:12px 24px;width:max-content;max-width:100%}
.code b{font-family:var(--mono);font-size:clamp(36px,4.6vw,80px);color:var(--amber);letter-spacing:.06em;line-height:1}
.join{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,60px);align-items:center}
#qr{background:#fff;padding:14px;border-radius:12px;width:max-content}
.url{font-family:var(--mono);font-size:.75em;word-break:break-all;color:var(--muted)}
.fam{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fam div{border-radius:14px;padding:14px 16px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.15em;line-height:1.1}
.fam small{display:block;font-family:var(--body);font-weight:500;font-size:.62em;opacity:.9;margin-top:4px}
.rules{display:grid;gap:14px}
.rules div{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;font-size:1.25em;font-family:var(--display);font-weight:700}
.rules i{font-style:normal;font-family:var(--mono);background:var(--amber);color:var(--bg);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;font-size:.8em}
.round{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(18px,3vw,48px);align-items:start;flex:1}
.timer{display:grid;gap:10px;justify-items:start}
.timer .t{font-family:var(--mono);font-weight:700;font-size:clamp(70px,10vw,190px);line-height:1}
.timer .t.warn{color:var(--amber)}
.timer .t.end{color:#ff8f7a}
.timer .st{font-size:1.1em;font-weight:600;min-height:1.5em}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.inbox{display:grid;gap:12px}
.mail{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-left:10px solid var(--k)}
.mail.latest{border-color:var(--amber);border-left-color:var(--k);box-shadow:0 0 0 2px var(--amber)}
.mail .to{font-family:var(--display);font-weight:700;font-size:1.1em}
.mail .to small{display:block;font-family:var(--body);font-weight:500;font-size:.65em;color:var(--muted)}
.mail b{font-family:var(--mono);color:var(--amber);font-size:1.5em;letter-spacing:.06em}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.cq{display:grid;gap:14px}
.cqc{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:16px 20px;display:grid;gap:8px}
.cqc h3{font-size:1.2em}
.cqc .tx{font-size:1.1em}
.cqc.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 22%,var(--panel))}
.cqc.off{opacity:.55}
.cqc .tag{font-family:var(--mono);font-size:.65em;letter-spacing:.08em;text-transform:uppercase}
.cqc.on .tag{color:#ff9a85}.cqc.off .tag{color:#7fd6a3}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chain .lk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;min-height:7.5em;font-size:.85em}
.chain .lk b{font-family:var(--mono);color:var(--amber);font-size:1.1em}
.chain .lk.hid{border-style:dashed;color:transparent}
.chain .lk.hid b{color:var(--muted)}
.qs{margin:0;padding-left:1.3em;display:grid;gap:12px;font-size:1.1em}
.maptab{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:.9em}
.maptab td{padding:12px 14px;background:var(--panel);vertical-align:top}
.maptab td:first-child{color:#fff;font-family:var(--display);font-weight:700;border-radius:12px 0 0 12px;width:18%}
.maptab td:last-child{border-radius:0 12px 12px 0}
.maptab .hid{color:transparent;background:repeating-linear-gradient(45deg,var(--panel),var(--panel) 10px,var(--panel-2) 10px,var(--panel-2) 20px)}
.close{font-size:clamp(30px,3.6vw,62px);font-family:var(--display);font-weight:700;max-width:26ch;line-height:1.15}
.chain.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chain .lk.pt{border-color:var(--amber);min-height:5em}
.chain .lk.pt b{font-family:var(--display);font-size:1.05em}
.chain .lk.pt.hid b{color:transparent}
.beo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.beo .st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start;min-height:9em}
.beo .st:nth-child(1){border-top:8px solid var(--red)}.beo .st:nth-child(2){border-top:8px solid #d69a1f}.beo .st:nth-child(3){border-top:8px solid var(--green)}
.beo .sl{font-family:var(--display);font-weight:800;font-size:1.6em;line-height:1}
.beo .ss{color:var(--muted);font-size:.75em;text-transform:uppercase;letter-spacing:.1em}
.beo .st p{font-size:1.15em}
.beo .st.hid{border-style:dashed}.beo .st.hid p,.beo .st.hid .ss{visibility:hidden}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:#0a1017;font-size:14px}
.bar .nav{display:flex;gap:8px;align-items:center}
.bar .hint{color:var(--muted);max-width:70ch}
@media (max-width:900px){.round{grid-template-columns:1fr}.fam{grid-template-columns:1fr 1fr}.chain{grid-template-columns:1fr 1fr}.join{grid-template-columns:1fr}}
</style>
</head>

  const JOIN_FILE = "the-6pm-number.html";
  const KEY = "fv-host-v1";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(blob, code) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.s), iterations: 120000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.i) }, key, b64(blob.c))));
  }
  let V = null, i = 0, tick = null;
  let T = { 1: { el: 0, run: null, sent: [] }, 2: { el: 0, run: null, sent: [] }, cq: {}, chain: 0, map: 0, read: { el: 0, run: null } };
  try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved) { T = Object.assign(T, saved.T); i = saved.i || 0; } } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ T, i })); } catch (e) {} };
  const roleOf = id => V.roles.find(r => r.id === id);
  const elapsed = t => t.el + (t.run ? (Date.now() - t.run) / 1000 : 0);
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  function gate() {

    $("#g").onsubmit = async e => {
      e.preventDefault(); $("#gm").textContent = "Checking…";
      try { V = await decrypt(VAULT, $("#gi").value.trim().toUpperCase()); boot(); }
      catch (err) { $("#gm").textContent = "That code didn't work."; }
    };
  }

  const SLIDES = ["join", "brief", "read", "r1", "s1", "r2", "s2", "chain", "ask", "map", "close"];
  const HINT = {
    join: "Everyone scans, types the event code and picks their table's role.",
    brief: "Read this aloud. Hand each table its sealed envelope.",
    read: "Three minutes of silent reading. Start the timer.",
    r1: "Have everyone type the round code, then press Start. Hand the IFC table (Mum) its cash envelope as soon as the round starts.",
    s1: "Stop all talk. Check the vendor receipts and mark each consequence. Read the ones that apply aloud.",
    r2: "Have everyone type the round code, then press Start. Say nothing about the hotel.",
    s2: "Check the hotel receipt and the activity receipts. Then fill in the final ledger on the flipchart.",
    chain: "Let the room build the chain. Reveal each box only after they've named it, then the three pressure tests.",
    ask: "Pick the incident, then reveal Blame, Explain and Own one at a time. Use the times from your notes.",
    map: "Ask each table for a real moment before you reveal its row.",
    close: "Each person answers all three on their phone or on paper.",
  };

  function boot() {
    clearInterval(tick);
    tick = setInterval(() => { if (["r1", "r2", "read"].includes(SLIDES[i])) update(); }, 250);
    document.onkeydown = e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight" || e.key === "PageDown") go(1); if (e.key === "ArrowLeft" || e.key === "PageUp") go(-1); };
    draw();
  }
  function go(d) { i = Math.max(0, Math.min(SLIDES.length - 1, i + d)); persist(); draw(); }

  function draw() {
    const k = SLIDES[i];
    let h = "";
    if (k === "join") {
      h = `<div class="kicker">VOLTAS · OWNERSHIP AND ACCOUNTABILITY</div><h1 class="title">Operation: Family Vacation</h1>
        <div class="join"><div id="qr"></div><div style="display:grid;gap:16px"><p class="lead">Scan, type the event code, then choose the department on your table's sign.</p>
        <div class="code"><span class="muted">Event code</span><b>${esc(V.event)}</b></div><p class="url" id="url"></p><button class="btn ghost" id="ns" style="justify-self:start">Start a fresh session</button></div></div>`;
    } else if (k === "brief") {
      h = `<div class="kicker">THE BRIEF</div><h1 class="h">One family. Six days in Sundarpur. ₹5,00,000.</h1>
        <div class="fam">${V.roles.map(r => `<div style="background:${r.color}">${esc(r.dept)}<small>plays ${esc(r.short)}</small></div>`).join("")}<div style="background:${V.kids.color}">Your facilitator<small>plays the kids, Aarav and Tara. Expect them at your table.</small></div></div>
        <div class="rules">${V.rules.map((t, n) => `<div><i>${n + 1}</i><span>${esc(t)}</span></div>`).join("")}</div>`;
    } else if (k === "read") {
      h = `<div class="kicker">BEFORE ROUND 1</div><h1 class="h">Read your role card in silence</h1>
        <div class="timer"><div class="t" id="tt"></div><div class="ctl"><button class="btn" id="go"></button><button class="btn ghost" id="rs">Reset</button></div></div>

    } else if (k === "r1" || k === "r2") {
      const n = k === "r1" ? 1 : 2;
      h = `<div class="kicker">ROUND ${n} OF 2 · 15 MINUTES</div>
        <div class="round"><div class="timer"><div class="t" id="tt"></div><div class="st" id="ts"></div>
          <div class="code"><span class="muted">Round code</span><b>${esc(V.roundCodes[n])}</b></div>
          <p style="font-size:.85em">Everyone types this code now. Your table's messages will arrive on your phones during the round.</p>
          <div class="ctl"><button class="btn" id="go"></button><button class="btn ghost" id="rs">Reset</button></div></div>
        <div><h2 class="h" style="font-size:1.6em;margin-bottom:12px">Messages sent</h2><div class="inbox" id="ib"></div></div></div>`;
    } else if (k === "s1" || k === "s2") {
      const n = k === "s1" ? 1 : 2;
      const list = V.conseq.filter(c => c.when === `End of Round ${n}`);
      h = `<div class="kicker">END OF ROUND ${n}</div><h1 class="h">What happens now</h1>
        <div class="cq">${list.map(c => { const st = T.cq[c.id]; return `<div class="cqc ${st === true ? "on" : st === false ? "off" : ""}">
          <div class="tag">${st === true ? "This happened" : st === false ? "Avoided" : "Checking…"}</div>
          <h3>${esc(c.if)}</h3>${st === true ? `<p class="tx">${esc(c.text)}</p>` : ""}
          <div class="ctl"><button class="btn ghost" data-c="${c.id}" data-v="1">It applies</button><button class="btn ghost" data-c="${c.id}" data-v="0">Avoided</button></div></div>`; }).join("")}</div>`;
    } else if (k === "chain") {
      const n = V.chain.length;
      h = `<div class="kicker">DEBRIEF · 1</div><h1 class="h">Where did this start?</h1>

      $("#go").onclick = () => { if (t.run) { t.el = elapsed(t); t.run = null; } else t.run = Date.now(); persist(); update(); };
      $("#rs").onclick = () => { if (!confirm("Reset this timer" + (k === "read" ? "?" : " and its messages?"))) return; t.el = 0; t.run = null; if (t.sent) t.sent = []; persist(); draw(); };
      if (false) $("#nx").onclick = () => { const n = k === "r1" ? 1 : 2; const next = V.triggers.find(x => x.round === n && !t.sent.includes(x.n)); if (next) { t.sent.push(next.n); persist(); update(); } };
      update();
    }
    document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { T.cq[b.dataset.c] = b.dataset.v === "1"; persist(); draw(); });
    if (k === "chain") { const tot = V.chain.length + V.pressure.length; $("#rv").onclick = () => { T.chain = Math.min(tot, T.chain + 1); persist(); draw(); }; $("#rh").onclick = () => { T.chain = 0; persist(); draw(); }; }
    if (k === "ask") {
      document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { T.inc = +b.dataset.inc; T.stage = 0; persist(); draw(); });
      $("#sv").onclick = () => { T.stage = Math.min(3, (T.stage || 0) + 1); persist(); draw(); };
      $("#sr").onclick = () => { T.stage = 0; persist(); draw(); };
    }
    if (k === "map") { $("#rv").onclick = () => { T.map = Math.min(V.map.length, T.map + 1); persist(); draw(); }; $("#ra").onclick = () => { T.map = V.map.length; persist(); draw(); }; }
  }

  let lastSig = "";
  function update() {
    const k = SLIDES[i];
    const isRead = k === "read";
    const len = isRead ? 180 : 900;
    const t = isRead ? T.read : T[k === "r1" ? 1 : 2];
    const e = elapsed(t), left = len - e;
    const tt = $("#tt"); if (!tt) return;
    tt.textContent = fmt(left);
    tt.className = "t" + (left <= 0 ? " end" : left <= 120 ? " warn" : "");
    $("#go").textContent = t.run ? "Pause" : e > 0 ? "Resume" : "Start";
    if (left <= 0 && t.run) { t.el = len; t.run = null; persist(); }
    if (isRead) return;
    const n = k === "r1" ? 1 : 2;
    $("#ts").textContent = left <= 0 ? "Time. Stop all talk." : left <= 120 ? "Two minutes left in this round." : "";
    V.triggers.filter(x => x.round === n && e > 0 && e >= x.offset && !t.sent.includes(x.n)).forEach(x => { t.sent.push(x.n); persist(); });
    const sig = t.sent.join(",");
    if (sig !== lastSig || !$("#ib").dataset.drawn) {
      lastSig = sig;
      const sent = V.triggers.filter(x => t.sent.includes(x.n)).sort((a, b) => t.sent.indexOf(a.n) - t.sent.indexOf(b.n)).reverse();
      $("#ib").innerHTML = sent.length ? sent.map((x, j) => { const r = roleOf(x.to); return `<div class="mail${j === 0 ? " latest" : ""}" style="--k:${r.color}"><div class="to">Message for ${esc(r.dept)}<small>Playing ${esc(r.short)} · only this table can see it</small></div><b>${fmt(x.offset)}</b></div>`; }).join("") : `<div class="empty">No messages yet. They arrive once the timer is running.</div>`;
      $("#ib").dataset.drawn = "1";
    }
  }
  gate();
})();
</script>
</body>
</html>
