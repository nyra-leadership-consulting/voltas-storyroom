<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 6 PM Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0c131b; --panel:#141e29; --panel-2:#1b2836; --line:#2a3a4b; --ink:#e8eef4; --muted:#93a4b5;
  --amber:#f2a93b; --team:#2563a8;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit}
.notes textarea{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:16px;resize:vertical;margin-top:6px}
.notes textarea:disabled{opacity:.8}
.notes .btn{margin-top:10px}
.fields{display:grid;gap:10px;margin-top:6px}
.fld{display:grid;gap:4px;font-size:15px;font-weight:600}
.fld .row{display:flex;align-items:center;gap:8px}
.fld input{flex:0 1 180px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:17px}
.fld select{flex:0 1 180px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:17px}
.needp{border-color:var(--accent,#F2A93B)}
.fld em{font-style:normal;color:var(--muted);font-weight:400;font-size:15px}
.need li{color:var(--ink)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}

/* start */
.start{display:grid;gap:18px;padding-top:12px}
.start .clock{font-family:var(--mono);font-size:46px;font-weight:700;color:var(--amber);letter-spacing:-.02em;line-height:1}
.start h1{font-size:42px}
.tables{display:grid;gap:10px}
.tbtn{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;border:0;border-radius:14px;padding:16px 18px;color:#fff;cursor:pointer;font-weight:700;font-size:20px;font-family:var(--display)}
.tbtn small{display:block;font-family:var(--mono);font-size:12px;font-weight:500;opacity:.85}
.pbtn{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start;padding:4px 0;font-size:15px}
.field input.name{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:14px;font-size:19px}
.tbtn .n{font-family:var(--mono);font-size:30px;line-height:1}

/* team header */
.band{background:var(--team);border-radius:14px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band h2{font-size:26px}
.band small{white-space:nowrap;font-family:var(--mono);font-size:12px;opacity:.85;display:block}
.band button{background:rgba(0,0,0,.22);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}

/* code */
.code{display:grid;grid-template-columns:1fr auto;gap:8px}
.code input::placeholder{text-transform:none;letter-spacing:normal;font-family:var(--body)}
.code input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:19px;text-transform:uppercase;letter-spacing:.08em;min-width:0}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--amber);color:#1a1205}
.msg{font-size:14px;min-height:20px;color:var(--muted)}
.msg.err{color:#ff8f7a}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.head h2{font-size:28px}
.head .t{font-family:var(--mono);color:var(--amber);font-weight:700;font-size:18px;white-space:nowrap}
.side{font-weight:700;font-size:18px;border-left:4px solid var(--team);padding-left:12px}
.quote{font-style:italic;background:var(--panel-2);border-radius:10px;padding:12px 14px}
.talk{margin:0;padding-left:20px;display:grid;gap:2px}
.facts{margin:0;padding:0;list-style:none;counter-reset:f;display:grid;gap:10px}
.facts li{counter-increment:f;display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--panel-2);border-radius:10px;padding:12px}
.facts li::before{content:counter(f);font-family:var(--mono);font-weight:700;color:var(--team);filter:brightness(1.6)}
.rules{display:grid;gap:4px;font-weight:600}

.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px 12px;color:var(--ink);cursor:pointer;font-size:17px;line-height:1.4}
.opt b{font-family:var(--mono);font-size:20px;color:var(--muted)}
.opt.shown{cursor:default;border-color:var(--k);background:color-mix(in srgb,var(--k) 22%,var(--panel-2))}
.opt.shown[aria-current="true"]{outline:3px solid var(--ink);outline-offset:2px}
.opt.shown b{color:var(--ink)}
.opt .kl{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);margin-bottom:2px}
.opt .km{display:block;font-size:14px;color:var(--ink);opacity:.8;margin-top:6px}
.mycard{font-size:19px;font-weight:600;background:var(--panel-2);border-left:4px solid var(--team);border-radius:0 10px 10px 0;padding:12px 14px;line-height:1.45}
.mycard.extra{border-left-style:dashed;font-weight:500}
.pressure{font-style:italic;color:var(--amber);font-size:15px}
.need{font-weight:600;border-left:4px solid var(--amber);padding-left:12px}
.short{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 16px}
.short summary{cursor:pointer;font-weight:600;color:var(--muted)}
.short p{margin:8px 0;font-size:14px}
.cardbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
.commit{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.commit label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.commit input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:17px;min-width:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.result .rc{font-weight:700;font-size:18px;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;justify-self:start;overflow-wrap:anywhere}
.askq{font-weight:700;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c,var(--line));background:var(--panel-2);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.chip.none{--c:#5b6b7a}
.goto{background:var(--panel-2);border:2px solid var(--amber);border-radius:12px;padding:14px;display:grid;gap:6px;text-align:center}
.goto.done{border-color:var(--line)}
.gt{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--amber);line-height:1}
.goto.done .gt{font-size:24px;color:var(--ink)}
.chip:disabled{cursor:default;opacity:.9}
.askwhat{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.askwhat input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:16px}
.btn.lock{width:100%;padding:16px;font-size:18px}
body.shaded{transition:background .4s}
body.shaded .band{background:rgba(0,0,0,.28)}
body.shaded .tabs button{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.25)}
body.shaded .tabs button[aria-pressed="true"]{background:#fff;color:#111}
body.shaded .code input{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.3)}
body.shaded .code input::placeholder{color:rgba(255,255,255,.75)}
body.shaded .msg{color:#fff}
.result{min-width:0;display:grid;gap:14px;color:#fff;padding:8px 2px 20px}
.result .rl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.85}
.result .rq{font-size:17px;opacity:.95}
.result .side2{font-weight:700}
.result .ra{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2}
.result .ra b{font-family:var(--mono);margin-right:6px}
.result .rw{margin-top:8px;font-weight:600;opacity:.9}
.opt[aria-pressed="true"]{border-color:var(--amber);background:#2a2414}
.opt[aria-pressed="true"] b{color:var(--amber)}
.wait{text-align:center;padding:22px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15}

.rv{display:grid;gap:8px}
.rv .row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 12px;background:var(--panel-2);border-left:6px solid var(--k)}
.rv .row b{font-family:var(--mono)}
.tray{display:grid;gap:10px}
.tx{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.tx p{font-size:17px;line-height:1.4}
.tx .ar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tx .ar button{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px;font-weight:700;font-size:16px;cursor:pointer}
.tx .ar button[data-v="approve"][aria-pressed="true"]{background:#1d774a;border-color:#2f9a63;color:#fff}
.tx .ar button[data-v="reject"][aria-pressed="true"]{background:#a3321d;border-color:#c8432b;color:#fff}
.tx .ar button:disabled{cursor:default}
.has{margin:0;padding-left:20px;display:grid;gap:6px}
.verdict{font-size:14px;border-radius:8px;padding:8px 10px;background:rgba(255,255,255,.06)}
.verdict b{margin-right:6px}
.ok{color:#7fd6a3}.no{color:#ff9a85}
.rv .row.mine{outline:3px solid var(--ink);outline-offset:2px}
.rv .row{background:color-mix(in srgb,var(--k) 16%,var(--panel-2))}
.rv .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.rv .z{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--k);color:#fff;border-radius:999px;padding:2px 8px}
.rv .you{font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 8px}
.rv .st{display:block;font-size:16px;line-height:1.4}
.rv .mean{display:block;font-size:13px;margin-top:6px}
.icelink{display:block;padding:0;border:0;background:none;width:100%;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:50;padding:12px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
@media (orientation:portrait){.zoom img{position:absolute;top:50%;left:50%;width:min(calc(100vh - 24px),calc(150vw - 36px));max-width:none;max-height:none;height:auto;transform:translate(-50%,-50%) rotate(90deg)}}
.ice{display:block;width:calc(100% + 32px);margin:-18px -16px 4px;border-radius:14px 14px 0 0;aspect-ratio:3/2;object-fit:cover}
.lines{display:grid;gap:10px}
.ln{border-left:6px solid var(--k);background:color-mix(in srgb,var(--k) 14%,var(--panel-2));border-radius:0 10px 10px 0;padding:10px 12px;display:grid;gap:4px}
.ln .lt{font-family:var(--display);font-weight:700;font-size:20px}
.ln b{margin-right:4px}
.rv .k{font-weight:700;color:var(--k);filter:brightness(1.35)}
.flowmap{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.flowmap summary{cursor:pointer;font-weight:700;font-size:15px}
.flowmap ol{margin:8px 0 2px;padding-left:22px;display:grid;gap:3px;font-size:15px}
/* laptop layout: same page, team card fixed on the left */
@media (min-width:960px){
  body{font-size:18px}
  .wrap.wide{max-width:1280px;padding:28px 32px 60px}
  .cols{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:28px;align-items:start}
  .cols aside{position:sticky;top:20px;display:grid;gap:14px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
  .cols .main{display:grid;gap:14px;min-width:0}
  .start{max-width:560px;margin:0 auto;width:100%}
  .result .ra{font-size:32px}
  .ice{aspect-ratio:16/9}
}
</style>
<style>
.clockbar{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--amber);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.clockbar .st{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--amber);line-height:1}
.clockbar .sm{font-size:14px;color:var(--muted)}
.clockbar.late{border-color:#c8432b}
.clockbar.late .st{color:#ff8f7a}
.qcard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.qcard.saved{border-color:#2f9a63}
.qcard .qq{font-weight:700;font-size:18px;line-height:1.35}
.qcard .who{display:grid;gap:6px}
.qcard .stamp{font-size:14px;color:#7fd6a3;font-weight:600}
.qcard .stamp.late{color:#ff9a85}
.gate{font-size:14px;color:var(--amber)}
.gate.late{color:#ff9a85}
.status{display:grid;gap:6px}
.status p{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-weight:600}
.report{display:grid;gap:10px}
.report select{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:17px;max-width:260px}
.report label.ck{display:flex;gap:10px;align-items:center;font-weight:600}
.report input[type=checkbox]{width:22px;height:22px}
.otable{width:100%;border-collapse:collapse;font-size:15px}
.otable th,.otable td{border:1px solid var(--line);padding:8px;text-align:left}
.otable th{background:var(--panel-2)}
.small{font-size:14px}
</style>
</head>

  }

  let roster = null, step = "event", pending = null;
  const norm = x => x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  function startView() {
    const head = `<div class="clock">4:00 PM</div><h1>The 6 PM Number</h1>`;
    if (step === "event") {
      $("#app").innerHTML = `<section class="start">${head}
        <p class="muted">Enter the event code shown on the big screen.</p>
        <form class="code" id="ef" autocomplete="off"><input id="ei" placeholder="Event code" aria-label="Event code" enterkeyhint="go"><button class="btn">Next</button></form>
        <p class="msg" id="em"></p></section>`;
      $("#ef").onsubmit = async e => {
        e.preventDefault(); const m = $("#em"); m.className = "msg"; m.textContent = "Checking…";
        try { roster = await decrypt(ROSTER, $("#ei").value.trim().toUpperCase().replace(/\s+/g, "")); step = "pick"; startView(); }
        catch (err) { m.className = "msg err"; m.textContent = "That code didn't work. Check the big screen."; }
      };
      return;
    }
    if (step === "name") {
      $("#app").innerHTML = `<section class="start">${head}
        <p class="muted">Type your name, then choose it.</p>
        <div class="field"><input id="ni" class="name" placeholder="Your name" aria-label="Your name" autocomplete="off"></div>
        <div class="tables" id="nl"></div>
        <button class="link" id="nf">I can't find my name</button></section>`;
      const draw = () => {
        const q = norm($("#ni").value);
        const hits = q.length < 2 ? [] : roster.filter(p => norm(p.name).split(" ").some(w => w.startsWith(q)) || norm(p.name).includes(q)).slice(0, 8);
        $("#nl").innerHTML = q.length < 2 ? "" : hits.length ? hits.map(p => `<button class="pbtn" data-i="${roster.indexOf(p)}">${esc(p.name)}</button>`).join("") : `<p class="muted">No match yet. Try your first name or surname.</p>`;
        $$(".pbtn").forEach(b => b.onclick = () => { pending = roster[+b.dataset.i]; step = "confirm"; startView(); });
      };
      $("#ni").oninput = draw; $("#ni").focus();
      $("#nf").onclick = () => { step = "pick"; startView(); };
      return;
    }
    if (step === "confirm") {
      const t = TEAMS.find(x => x.id === pending.team);
      $("#app").innerHTML = `<section class="start">
        <p class="muted">Hi ${esc(pending.name.split(" ")[0])}. Your team is</p>
        <div class="tbtn" style="background:${t.color};cursor:default"><span class="n">${t.table}</span><span>${esc(t.name)}<small>Table ${t.table}</small></span></div>
        <p class="big">Go and sit at Table ${t.table}.</p>
        <button class="btn" id="ok">That's me, let's go</button>
        <button class="link" id="no">That's not me</button></section>`;
      $("#ok").onclick = () => { S = fresh(); S.team = t.id; S.me = pending.name; save(); render(); scrollTo(0, 0); };
      $("#no").onclick = () => { step = "name"; startView(); };
      return;
    }
    $("#app").innerHTML = `<section class="start">${head}
        <p class="muted">Which table are you? Choose it below. If you're not sure, ask the facilitator.</p>
        <div class="tables">${TEAMS.map(t => `<button class="tbtn" data-t="${t.id}" style="background:${t.color}"><span class="n">${t.table}</span><span>${esc(t.name)}<small>Table ${t.table}</small></span></button>`).join("")}</div>
        <button class="link" id="bk">Playing on your own phone? Find yourself by name</button></section>`;
    $$("[data-t]").forEach(b => b.onclick = () => { S = fresh(); S.team = b.dataset.t; S.manual = true; save(); render(); scrollTo(0, 0); });
    $("#bk").onclick = () => { step = "name"; startView(); };
  }

  function cardHTML(t) {
    return `<section class="panel">
      <p class="label">What your team does</p><p>${esc(t.job)}</p>
      <p class="label">Where you sit</p><p class="side">${esc(t.sits)}</p>
      <details class="flowmap"><summary>How the ₹57 crore is built</summary><ol>${t.map.map(m => `<li>${esc(m)}</li>`).join("")}</ol></details>
      <p class="label">What your team holds</p>
      <ol class="facts">${t.holds.map(f => `<li><span>${esc(f)}</span></li>`).join("")}</ol>
      <p class="pressure">${esc(t.pressure)}</p>
      <div class="rules muted"><span>No team in this room has the full picture.</span><span>You can talk to anyone in this room.</span></div>
    </section>`;
  }

  function clockHTML() {
    if (!S.visit) return "";
    const m = storyMin(), left = realLeft(), late = m > CLOCK.cutoff;
    return `<div class="clockbar${late ? " late" : ""}" id="clk"><div><p class="label">Story time</p><p class="st" id="clkt">${hm(m)}</p></div>
      <p class="sm" id="clks">${late ? "After 5:45: anything reaching IFC now can't be reviewed by 6 PM." : `Visits end at 5:45 PM. Real time left: ${fmt(left)}`}</p></div>`;
  }

  function questionHTML(x, locked) {
    const a = S.ans[x.id] || { v: [], who: null }, isSaved = saved(x.id), dis = isSaved || locked || !S.visit ? "disabled" : "";
    const vals = a.v || [];
    return `<div class="qcard${isSaved ? " saved" : ""}" data-q="${x.id}">
      <p class="qq">${esc(x.q)}</p>
      <div class="fields">${x.fields.map(([l, u, k, o], i) => `<label class="fld"><span>${esc(l)}</span><span class="row">${k === "yesno" || k === "choice"
        ? `<select data-f="${i}" ${dis}><option value="">Choose</option>${(o || []).map(v => `<option ${vals[i] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`
        : `<input data-f="${i}" inputmode="${k === "time" ? "text" : "decimal"}" placeholder="${k === "time" ? "e.g. 5:00" : "0"}" value="${esc(vals[i] == null ? "" : vals[i])}" ${dis}>`}<em>${esc(u === "₹" ? "rupees" : u)}</em></span></label>`).join("")}</div>
      <div class="who"><span class="label">Who told you?</span><div class="chips">${TEAMS.filter(y => y.id !== S.team).map(y => `<button type="button" class="chip" data-who="${y.id}" aria-pressed="${a.who === y.id}" style="--c:${y.color}" ${dis}>${esc(y.short)}</button>`).join("")}</div></div>
      ${locked ? (isSaved ? `<p class="stamp">Saved at ${hm(a.at)}</p>` : `<p class="stamp late">Not answered</p>`)
        : !S.visit ? `<p class="muted small">You can fill this in once the visits start.</p>`
        : isSaved ? `<p class="stamp${a.at > CLOCK.cutoff ? " late" : ""}">Saved at ${hm(a.at)}${a.at > CLOCK.cutoff ? ", after 5:45" : ""}</p><button class="btn ghost" data-chg="${x.id}" type="button">Change this answer</button>`
        : `<button class="btn" data-save="${x.id}" type="button" disabled>Save answer</button>`}
    </div>`;
  }

  function trayHTML(c, locked) {
    const items = c.intray;
    return `<section class="panel"><p class="label">Your in-tray</p>
      <p class="muted small">${locked ? "What your table decided." : "Reject while the evidence is missing. Approve only when the named evidence or approval has actually reached you. You can change a decision until you lock in."}</p>
      <div class="tray">${items.map((x, i) => { const g = gateState(x), v = S.tray[i];
        const miss = x.gate ? x.gate.filter(q => q === "bh" ? !bhIn() : !saved(q)) : [];
        const gateMsg = g === "missing" ? `To approve, first ${miss.map(q => q === "bh" ? "get the business head's written confirmation (button above)" : `find out and save: “${esc(c.qa.find(y => y.id === q).q)}”`).join(", and ")}`
          : g === "late" ? (S.team === "ifc" ? "This reached you after 5:45. A 15-minute review can't finish by 6 PM, so it can't be approved tonight. Leave it rejected and tell Corp Finance it's pending." : "This reached you after 5:45, too late to book for the 6 PM report. Leave it rejected and tell Corp Finance these bills are pending.") : "";
        return `<div class="tx"><p><b>${i + 1}.</b> ${esc(x.text)}</p>
        ${!locked && gateMsg ? `<p class="gate${g === "late" ? " late" : ""}">${gateMsg}</p>` : ""}
        <div class="ar">${["approve", "reject"].map(d => `<button data-tx="${i}" data-v="${d}" aria-pressed="${v === d}" ${locked || (d === "approve" && g !== "open") ? "disabled" : ""}>${d === "approve" ? "✔ Approve" : "✖ Reject"}</button>`).join("")}</div></div>`; }).join("")}</div>
      ${S.team === "ifc" ? ifcStatusHTML(c) : ""}</section>`;
  }
  function ifcStatusHTML(c) {
    const st = i => S.tray[i] === "approve" ? "approved" : "pending";
    return `<div class="status"><p class="label">What you can tell Corp Finance right now</p><p>Payroll's ₹0.8 crore incentive change: ${st(1) === "approved" ? "cleared" : "pending"}</p><p>Installation provision, ₹0.5 crore: ${st(2)}</p></div>`;
  }
  function reportHTML(c, locked) {
    const r = S.report;
    return `<section class="panel report"><p class="label">Your 6 PM report to the CFO</p>
      <p class="muted small">The bills count once Shared Services has booked them; they don't need IFC. The incentive correction and the installation provision count only if IFC approved them by 6 PM. List anything not done as pending: its value stays in the figure.</p>
      <label class="fld"><span>Operating profit you will report</span><select id="rfig" ${locked ? "disabled" : ""}><option value="">Choose</option>${c.figs.map(f => `<option value="${f}" ${String(r.fig) === String(f) ? "selected" : ""}>₹${f.toFixed(1)} crore</option>`).join("")}</select></label>
      <p class="label">Listed as pending</p>
      ${Object.entries(c.pending).map(([k, l]) => `<label class="ck"><input type="checkbox" data-pend="${k}" ${r.pend[k] ? "checked" : ""} ${locked ? "disabled" : ""}> ${esc(l)}</label>`).join("")}
    </section>`;
  }
  function bhHTML(locked) {
    const m = storyMin();
    return `<section class="panel"><p class="label">The business head</p>
      ${!S.bh ? `<p>She can confirm the installation cost in writing if you ask. Her reply takes ${BH} minutes.</p>${S.visit && !locked ? `<button class="btn" id="bhask" type="button">Ask the business head to confirm the installation cost in writing</button>` : `<p class="muted small">${locked ? "You didn't ask her." : "You can ask once the visits start."}</p>`}`
        : bhIn() ? `<p class="stamp">Written confirmation received at ${hm(S.bh + BH)}: “I confirm the cost of the 2,000 installations completed this month.”</p>`
        : `<p class="muted">Asked at ${hm(S.bh)}. Her reply arrives at ${hm(S.bh + BH)}.</p>`}</section>`;
  }
  function directHTML(c, locked) {
    const d = c.direct;
    return `<section class="panel"><p class="label">${esc(d.who)} asks you</p><p class="quote">“${esc(d.q)}”</p>
      <p>${locked ? "Your team said:" : "What would your team say? Choose one, as a team."}</p>
      <div class="opts">${d.options.map((o, i) => locked && S.pick !== i ? "" : `<button class="opt" data-i="${i}" aria-pressed="${S.pick === i}" ${locked ? "disabled" : ""}><b>${"ABC"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div></section>`;
  }

  function roundHTML(c, t) {
    c = Object.assign({}, c, { qa: c.qa[t.id], intray: c.intray[t.id], direct: c.direct[t.id] });
    const locked = S.locked;
    const left = c.intray.filter((x, i) => !S.tray[i]).length;
    const needReport = t.id === "cf" && (!S.report.fig);
    const unanswered = c.qa.filter(x => !saved(x.id)).length;
    let lockArea = "";
    if (!locked) {
      lockArea = !S.visit ? "" : left ? `<p class="muted small">Approve or reject ${left} more in-tray item${left > 1 ? "s" : ""} before you lock in.</p>`
        : needReport ? `<p class="muted small">Choose the figure for your 6 PM report before you lock in.</p>`
        : t.id === "cf" && storyMin() < CF_ASK ? `<p class="muted small">You can lock in once you've answered the CFO at 5:40.</p>`
        : S.pick === undefined ? `<p class="muted small">Choose your answer to the question above before you lock in.</p>`
        : `${unanswered ? `<p class="gate">${unanswered} question${unanswered > 1 ? "s" : ""} not answered yet. You can still lock in.</p>` : ""}<button class="btn lock" id="lock">Lock in our answers, in-tray and response</button><p class="muted small">You can't change anything after this.</p>`;
    }
    return `${clockHTML()}
    <section class="panel">
      <div class="head"><h2>${locked ? "Locked in" : "The round"}</h2><span class="t">${hm(storyMin())}</span></div>
      <p class="label">What's happening</p><p>${esc(c.situation)}</p>
      ${!S.visit ? `<p class="muted">Read your card, your questions and your in-tray as a table. When the facilitator says go, press the button. It starts your story clock: 8 minutes takes you from 4:00 to 5:45 PM.</p><button class="btn lock" id="go">Start the visits</button>` : ""}
    </section>
    <section class="panel needp"><p class="label">What you need to find out</p>
      <p class="muted small">Other teams hold these answers. Go and ask, fill in the answer and who told you, then save it. Save the moment you hear it: the time you save is the time it reached you.</p>
      ${c.qa.map(x => questionHTML(x, locked)).join("")}</section>
    ${t.id === "upbg" ? bhHTML(locked) : ""}
    ${trayHTML(c, locked)}
    ${t.id === "cf" ? reportHTML(c, locked) : ""}
    ${!S.visit ? "" : t.id === "cf" && !locked && storyMin() < CF_ASK ? `<section class="panel"><p class="label">The CFO</p><p class="muted">The CFO will call you at 5:40 PM. Her question appears here then.</p></section>` : directHTML(c, locked)}
    ${locked ? `<section class="panel"><p class="big">Locked in.</p><p class="muted">Wait for the next code on the big screen.</p></section>` : lockArea ? `<section class="panel">${lockArea}</section>` : ""}`;
  }

  function cfoHTML(c) {
    return `<section class="panel">
      <div class="head"><h2>The CFO call</h2><span class="t">6:00 PM</span></div>
      <p class="label">The CFO asks</p><p class="big">“${esc(c.line)}”</p>
      <p class="label">Agree as a team</p>
      <ul class="talk">${c.prompts.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <p class="muted">Your spokesperson answers when the CFO calls your table.</p>
    </section>`;
  }

  function revealHTML(c, t) {
    const qa = c.qa.filter(x => x.ask === t.id);
    const items = c.intray[t.id];
    const d = c.direct[t.id];
    const qPart = qa.map(x => { const a = S.ans[x.id];
      const has = a && a.at;
      const whoOk = has && x.hold.includes(a.who);
      return `<div class="tx"><p><b>${esc(x.q)}</b></p>
        ${x.fields.map(([l, ans, u, k], i) => { const ok = has && same(a.v[i], ans, k); return `<p class="verdict"><b class="${ok ? "ok" : "no"}">${ok ? "Right" : has ? "Not quite" : "Not answered"}</b>${esc(l)}: ${has ? `you wrote ${esc(a.v[i] ? UF(a.v[i], u) : "nothing")}. ` : ""}The answer: ${esc(UF(ans, u))}.</p>`; }).join("")}
        <p class="verdict"><b class="${whoOk ? "ok" : "no"}">${whoOk ? "Right" : has ? "Not quite" : "Not answered"}</b>Who holds it: ${esc(x.hold.map(tname).join(" or "))}.${has ? ` You wrote ${esc(a.who ? tname(a.who) : "no one")}, saved at ${hm(a.at)}.` : ""}</p></div>`; }).join("");
    const trayPart = items.map((x, i) => { const mine = S.tray[i], g = gateState(x);
      const right = x.right === "after" ? (g === "open" ? "approve" : "reject") : x.right;
      const good = mine === right;
      const note = x.right === "after" ? (g === "open" ? "You had the evidence in time, so approve." : g === "late" ? "It reached you after 5:45, so it stays pending tonight." : "You never had the evidence, so it had to stay rejected.") : "";
      return `<div class="tx"><p><b>${i + 1}.</b> ${esc(x.text)}</p><p class="verdict"><b class="${good ? "ok" : "no"}">${mine ? (mine === "approve" ? "You approved" : "You rejected") : "No decision"}</b>Right call for you: ${right}. ${esc(note)} ${esc(x.why)}</p></div>`; }).join("");
    let rep = "";
    if (t.id === "cf") {
      const r = S.report, fig = parseFloat(r.fig), p = r.pend || {};
      const expect = Math.round((52.0 + Object.keys(c.pval).reduce((a, k) => a + (p[k] ? c.pval[k] : 0), 0)) * 10) / 10;
      const ok = Math.abs(fig - expect) < 0.01;
      rep = `<section class="panel"><p class="label">Your 6 PM report</p>
        <p class="verdict"><b class="${ok ? "ok" : "no"}">${ok ? "Adds up" : "Doesn't add up"}</b>You reported ₹${isNaN(fig) ? "?" : fig.toFixed(1)} crore with ${Object.keys(p).filter(k => p[k]).map(k => c.pending[k]).join(" and ") || "nothing"} pending. With that list, the figure should be ₹${expect.toFixed(1)} crore.</p>
        <p class="muted small">It's the right answer if the pending list matches what was actually done by 6 PM. With all the bills booked, the four cases are:</p>
        <table class="otable"><tr><th>Installation provision</th><th>Payroll correction</th><th>Report</th></tr>${c.outcomes.map(o => `<tr><td>${o.prov ? "Approved" : "Pending"}</td><td>${o.pay ? "Approved" : "Pending"}</td><td><b>₹${o.fig.toFixed(1)} crore</b></td></tr>`).join("")}</table></section>`;
    }
    const pick = S.pick;
    return `<section class="panel">
      <button type="button" class="icelink" aria-label="Show the picture full size"><img class="ice" src="${LINE_IMG}" alt="An iceberg. Above the waterline: Acknowledge, Own, Act. You move the outcome forward. Below the waterline: Blame, Defend, Wait. You stay stuck."></button>
      <p class="muted" style="font-size:13px;margin-top:-4px">Click the picture to see it full size. On a phone, turn it sideways to read it.</p>
      <p class="muted small">Amber sits on the line: true, or doing our own part, but the outcome doesn't move.</p></section>
    <section class="panel"><p class="label">${esc(d.idea)} · ${esc(d.who)} asked</p><p class="quote">“${esc(d.q)}”</p>
      <div class="rv">${d.order.map((k, i) => { const z = c.zones[c.kinds[k].zone]; const mine = pick === i && S.locked;
        return `<div class="row${mine ? " mine" : ""}" style="--k:${c.kinds[k].color}"><b>${"ABC"[i]}</b><span>
          <span class="tags"><span class="k">${esc(c.kinds[k].label)}</span><span class="z">${esc(z.label)}</span>${mine ? `<span class="you">Your team's answer</span>` : ""}</span>
          <span class="st">“${esc(d.options[i])}”</span><span class="muted mean">${esc(c.kinds[k].meaning)}</span></span></div>`; }).join("")}</div></section>
    <section class="panel"><p class="label">What you needed to find out</p>${qPart}</section>
    <section class="panel"><p class="label">Your in-tray</p><div class="tray">${trayPart}</div></section>${rep}`;
  }

  function render() {
    try { renderInner(); } catch (err) {
      console.error(err);
      $("#app").innerHTML = `<section class="start"><h1>The 6 PM Number</h1><p>Something on this screen is out of date.</p><button class="btn" id="rs">Start fresh</button></section>`;
      $("#rs").onclick = () => { try { store && store.removeItem(STORE); } catch (e) {} location.replace(location.pathname + "?reset"); };
    }
  }
  const WIDE = window.matchMedia ? matchMedia("(min-width: 960px)") : { matches: false };
  function renderInner() {
    const t = team(), wide = WIDE.matches;
    $("#app").classList.toggle("wide", wide && !!t);
    if (!t) return startView();
    document.documentElement.style.setProperty("--team", t.color);
    const opened = ORDER.filter(n => S.open[n]);
    if (S.tab !== "card" && !S.open[S.tab]) S.tab = opened[opened.length - 1] || "card";
    if (wide && S.tab === "card" && opened.length) S.tab = opened[opened.length - 1];
    const tabs = [...(wide ? [] : [["card", "Our card"]]), ...opened.map(n => [n, NAME[n]])];
    const waitMsg = `<div class="wait">Read your team card together as a table.<br>When the round starts, type the code from the big screen ${wide ? "here" : "above"}.</div>`;
    let body;
    if (!opened.length) body = wide ? waitMsg : waitMsg + cardHTML(t);
    else if (S.tab === "card") body = cardHTML(t);
    else { const c = S.open[S.tab]; body = c.kind === "round" ? roundHTML(c, t) : c.kind === "cfo" ? cfoHTML(c) : revealHTML(c, t); }
    const done = ORDER.every(n => S.open[n]);
    const band = `<div class="band"><div><small>${S.me ? esc(S.me.split(" ")[0]) + " · " : ""}Table ${t.table}</small><h2>${esc(t.name)}</h2></div><button id="chg" type="button">Change table</button></div>`;
    const codeForm = done ? "" : `<form class="code" id="cf" autocomplete="off"><input id="ci" placeholder="Code on the screen" aria-label="Code from the big screen" enterkeyhint="go"><button class="btn">Open</button></form><p class="msg" id="cm"></p>`;
    const nav = opened.length ? `<nav class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${S.tab === k}">${l}</button>`).join("")}</nav>` : "";
    $("#app").innerHTML = wide ? `<div class="cols"><aside>${band}${cardHTML(t)}</aside><div class="main">${codeForm}${nav}${body}</div></div>` : `${band}${codeForm}${nav}${body}`;
    wire();
  }
  function rerender() { const y = scrollY; render(); scrollTo(0, y); }
  function wire() {
    $("#chg").onclick = () => { if (S.visit && !S.locked && !confirm("Change table? Your table's answers on this laptop will be cleared.")) return; S = fresh(); step = roster ? "pick" : "event"; save(); render(); scrollTo(0, 0); };
    $$("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); scrollTo(0, 0); });
    const go = $("#go"); if (go) go.onclick = () => { S.visit = Date.now(); save(); rerender(); };
    const ba = $("#bhask"); if (ba) ba.onclick = () => { S.bh = storyMin(); save(); rerender(); };
    $$(".qcard").forEach(card => {
      const id = card.dataset.q, fs = [...card.querySelectorAll("[data-f]")], sb = card.querySelector("[data-save]");
      S.ans[id] = S.ans[id] || { v: [], who: null };
      const a = S.ans[id];
      const chk = () => { if (sb) sb.disabled = fs.some(f => !f.value.trim()) || !a.who; };
      fs.forEach(f => { f.oninput = f.onchange = () => { a.v[+f.dataset.f] = f.value.trim(); save(); chk(); }; });
      card.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { a.who = b.dataset.who; save(); card.querySelectorAll("[data-who]").forEach(x => x.setAttribute("aria-pressed", x === b)); chk(); });
      chk();
      if (sb) sb.onclick = () => { a.v = fs.map(f => f.value.trim()); a.at = storyMin(); delete S.edit[id]; save(); rerender(); };
      const cb = card.querySelector("[data-chg]");
      if (cb) cb.onclick = () => { S.edit[id] = true; // anything approved on the strength of this answer goes back to undecided
        S.open.round.intray[S.team].forEach((x, i) => { if (x.gate && x.gate.includes(id) && S.tray[i] === "approve") delete S.tray[i]; }); save(); rerender(); };
    });
    $$("[data-tx]").forEach(b => b.onclick = () => { S.tray[+b.dataset.tx] = b.dataset.v; save(); rerender(); });
    $$(".opt").forEach(b => b.onclick = () => { S.pick = +b.dataset.i; save(); rerender(); });
    const rf = $("#rfig"); if (rf) rf.onchange = () => { S.report.fig = rf.value; save(); rerender(); };
    $$("[data-pend]").forEach(b => b.onchange = () => { S.report.pend[b.dataset.pend] = b.checked; save(); });
    const lk = $("#lock"); if (lk) lk.onclick = () => { S.locked = true; save(); render(); scrollTo(0, 0); };
    clearInterval(window.__clk); window.__phase = phase();
    if ($("#clk")) window.__clk = setInterval(() => {
      const m = storyMin(), el = $("#clkt"); if (!el) return clearInterval(window.__clk);
      if (phase() !== window.__phase) { window.__phase = phase(); return rerender(); }
      const late = m > CLOCK.cutoff;
      el.textContent = hm(m); $("#clks").textContent = late ? "After 5:45: anything reaching IFC now can't be reviewed by 6 PM." : `Visits end at 5:45 PM. Real time left: ${fmt(realLeft())}`;
      if (m >= CLOCK.end) clearInterval(window.__clk);
    }, 500);
    const f = $("#cf");
    if (f) f.onsubmit = async e => {
      e.preventDefault();
      const code = $("#ci").value.trim().toUpperCase().replace(/\s+/g, "");
      if (!code) return;
      const m = $("#cm"); m.className = "msg"; m.textContent = "Opening…";
      for (const blob of BLOBS) {
        try { const c = await decrypt(blob, code); S.open[c.kind] = c; S.tab = c.kind; save(); render(); scrollTo(0, 0); return; } catch (err) {}
      }
      m.className = "msg err"; m.textContent = "That code didn't work. Check the big screen and try again.";
    };
  }
  document.addEventListener("click", e => {
    if (e.target.closest(".icelink")) { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${LINE_IMG}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z); }
  });
  if (WIDE.addEventListener) WIDE.addEventListener("change", () => render());
  render();
})();
</script>
</body>
</html>
