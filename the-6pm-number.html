<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 6 PM Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0c131b; --panel:#141e29; --panel-2:#1b2836; --line:#2a3a4b; --ink:#e8eef4; --muted:#93a4b5;
  --amber:#f2a93b; --team:#2563a8;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit}
.notes textarea{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:16px;resize:vertical;margin-top:6px}
.notes textarea:disabled{opacity:.8}
.notes .btn{margin-top:10px}
.fields{display:grid;gap:10px;margin-top:6px}
.fld{display:grid;gap:4px;font-size:15px;font-weight:600}
.fld .row{display:flex;align-items:center;gap:8px}
.fld input{flex:0 1 180px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:17px}
.fld em{font-style:normal;color:var(--muted);font-weight:400;font-size:15px}
.need li{color:var(--ink)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}

/* start */
.start{display:grid;gap:18px;padding-top:12px}
.start .clock{font-family:var(--mono);font-size:46px;font-weight:700;color:var(--amber);letter-spacing:-.02em;line-height:1}
.start h1{font-size:42px}
.tables{display:grid;gap:10px}
.tbtn{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;border:0;border-radius:14px;padding:16px 18px;color:#fff;cursor:pointer;font-weight:700;font-size:20px;font-family:var(--display)}
.tbtn small{display:block;font-family:var(--mono);font-size:12px;font-weight:500;opacity:.85}
.pbtn{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start;padding:4px 0;font-size:15px}
.field input.name{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:14px;font-size:19px}
.tbtn .n{font-family:var(--mono);font-size:30px;line-height:1}

/* team header */
.band{background:var(--team);border-radius:14px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band h2{font-size:26px}
.band small{white-space:nowrap;font-family:var(--mono);font-size:12px;opacity:.85;display:block}
.band button{background:rgba(0,0,0,.22);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}

/* code */
.code{display:grid;grid-template-columns:1fr auto;gap:8px}
.code input::placeholder{text-transform:none;letter-spacing:normal;font-family:var(--body)}
.code input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:19px;text-transform:uppercase;letter-spacing:.08em;min-width:0}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--amber);color:#1a1205}
.msg{font-size:14px;min-height:20px;color:var(--muted)}
.msg.err{color:#ff8f7a}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.head h2{font-size:28px}
.head .t{font-family:var(--mono);color:var(--amber);font-weight:700;font-size:18px;white-space:nowrap}
.side{font-weight:700;font-size:18px;border-left:4px solid var(--team);padding-left:12px}
.quote{font-style:italic;background:var(--panel-2);border-radius:10px;padding:12px 14px}
.talk{margin:0;padding-left:20px;display:grid;gap:2px}
.facts{margin:0;padding:0;list-style:none;counter-reset:f;display:grid;gap:10px}
.facts li{counter-increment:f;display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--panel-2);border-radius:10px;padding:12px}
.facts li::before{content:counter(f);font-family:var(--mono);font-weight:700;color:var(--team);filter:brightness(1.6)}
.rules{display:grid;gap:4px;font-weight:600}

.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:14px 12px;color:var(--ink);cursor:pointer;font-size:17px;line-height:1.4}
.opt b{font-family:var(--mono);font-size:20px;color:var(--muted)}
.opt.shown{cursor:default;border-color:var(--k);background:color-mix(in srgb,var(--k) 22%,var(--panel-2))}
.opt.shown[aria-current="true"]{outline:3px solid var(--ink);outline-offset:2px}
.opt.shown b{color:var(--ink)}
.opt .kl{display:block;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);margin-bottom:2px}
.opt .km{display:block;font-size:14px;color:var(--ink);opacity:.8;margin-top:6px}
.mycard{font-size:19px;font-weight:600;background:var(--panel-2);border-left:4px solid var(--team);border-radius:0 10px 10px 0;padding:12px 14px;line-height:1.45}
.mycard.extra{border-left-style:dashed;font-weight:500}
.pressure{font-style:italic;color:var(--amber);font-size:15px}
.need{font-weight:600;border-left:4px solid var(--amber);padding-left:12px}
.short{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:12px 16px}
.short summary{cursor:pointer;font-weight:600;color:var(--muted)}
.short p{margin:8px 0;font-size:14px}
.cardbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
.commit{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.commit label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.commit input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:17px;min-width:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.result .rc{font-weight:700;font-size:18px;background:rgba(0,0,0,.22);border-radius:10px;padding:10px 12px;justify-self:start;overflow-wrap:anywhere}
.askq{font-weight:700;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c,var(--line));background:var(--panel-2);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.chip.none{--c:#5b6b7a}
.goto{background:var(--panel-2);border:2px solid var(--amber);border-radius:12px;padding:14px;display:grid;gap:6px;text-align:center}
.goto.done{border-color:var(--line)}
.gt{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--amber);line-height:1}
.goto.done .gt{font-size:24px;color:var(--ink)}
.chip:disabled{cursor:default;opacity:.9}
.askwhat{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.askwhat input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;font-size:16px}
.btn.lock{width:100%;padding:16px;font-size:18px}
body.shaded{transition:background .4s}
body.shaded .band{background:rgba(0,0,0,.28)}
body.shaded .tabs button{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.25)}
body.shaded .tabs button[aria-pressed="true"]{background:#fff;color:#111}
body.shaded .code input{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.3)}
body.shaded .code input::placeholder{color:rgba(255,255,255,.75)}
body.shaded .msg{color:#fff}
.result{min-width:0;display:grid;gap:14px;color:#fff;padding:8px 2px 20px}
.result .rl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.85}
.result .rq{font-size:17px;opacity:.95}
.result .side2{font-weight:700}
.result .ra{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2}
.result .ra b{font-family:var(--mono);margin-right:6px}
.result .rw{margin-top:8px;font-weight:600;opacity:.9}
.opt[aria-pressed="true"]{border-color:var(--amber);background:#2a2414}
.opt[aria-pressed="true"] b{color:var(--amber)}
.wait{text-align:center;padding:22px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15}

.rv{display:grid;gap:8px}
.rv .row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;border-radius:10px;padding:10px 12px;background:var(--panel-2);border-left:6px solid var(--k)}
.rv .row b{font-family:var(--mono)}
.tray{display:grid;gap:10px}
.tx{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.tx p{font-size:17px;line-height:1.4}
.tx .ar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tx .ar button{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px;font-weight:700;font-size:16px;cursor:pointer}
.tx .ar button[data-v="approve"][aria-pressed="true"]{background:#1d774a;border-color:#2f9a63;color:#fff}
.tx .ar button[data-v="reject"][aria-pressed="true"]{background:#a3321d;border-color:#c8432b;color:#fff}
.tx .ar button:disabled{cursor:default}
.has{margin:0;padding-left:20px;display:grid;gap:6px}
.verdict{font-size:14px;border-radius:8px;padding:8px 10px;background:rgba(255,255,255,.06)}
.verdict b{margin-right:6px}
.ok{color:#7fd6a3}.no{color:#ff9a85}
.rv .row.mine{outline:3px solid var(--ink);outline-offset:2px}
.rv .row{background:color-mix(in srgb,var(--k) 16%,var(--panel-2))}
.rv .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.rv .z{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--k);color:#fff;border-radius:999px;padding:2px 8px}
.rv .you{font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:999px;padding:2px 8px}
.rv .st{display:block;font-size:16px;line-height:1.4}
.rv .mean{display:block;font-size:13px;margin-top:6px}
.icelink{display:block;padding:0;border:0;background:none;width:100%;cursor:zoom-in}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:50;padding:12px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
@media (orientation:portrait){.zoom img{position:absolute;top:50%;left:50%;width:min(calc(100vh - 24px),calc(150vw - 36px));max-width:none;max-height:none;height:auto;transform:translate(-50%,-50%) rotate(90deg)}}
.ice{display:block;width:calc(100% + 32px);margin:-18px -16px 4px;border-radius:14px 14px 0 0;aspect-ratio:3/2;object-fit:cover}
.lines{display:grid;gap:10px}
.ln{border-left:6px solid var(--k);background:color-mix(in srgb,var(--k) 14%,var(--panel-2));border-radius:0 10px 10px 0;padding:10px 12px;display:grid;gap:4px}
.ln .lt{font-family:var(--display);font-weight:700;font-size:20px}
.ln b{margin-right:4px}
.rv .k{font-weight:700;color:var(--k);filter:brightness(1.35)}
.flowmap{background:var(--panel-2);border-radius:10px;padding:10px 14px}
.flowmap summary{cursor:pointer;font-weight:700;font-size:15px}
.flowmap ol{margin:8px 0 2px;padding-left:22px;display:grid;gap:3px;font-size:15px}
/* laptop layout: same page, team card fixed on the left */
@media (min-width:960px){
  body{font-size:18px}
  .wrap.wide{max-width:1280px;padding:28px 32px 60px}
  .cols{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:28px;align-items:start}
  .cols aside{position:sticky;top:20px;display:grid;gap:14px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
  .cols .main{display:grid;gap:14px;min-width:0}
  .start{max-width:560px;margin:0 auto;width:100%}
  .result .ra{font-size:32px}
  .ice{aspect-ratio:16/9}
}
</style>
</head>

<script>
(() => {
  const TEAMS = [{"id":"upbg","name":"UPBG F&C","table":1,"color":"#2563a8","job":"You are the finance team of UPBG, Voltas's room AC business. You keep score for the business: what it earned, what it spent and the profit it made this month.","sits":"Your costs only show up once other teams book them: Shared Services books supplier bills, Payroll books incentives, IFC approves costs without a bill. Your profit then goes into Corp Finance's report for the CFO.","map":["Shared Services books the bills suppliers send","Payroll books salaries and sales incentives","IFC approves any cost booked without a bill","UPBG adds it all up into the AC business's profit","Corp Finance adds every business together","The CFO: ₹57 crore operating profit"],"mapnote":"Routine items under ₹25 lakh each, such as hotel bills, partner fees and small Projects bills, were estimated at the start of the month and are already in the ₹57 crore. Booking their bills replaces the estimate, so operating profit doesn't move.","pressure":"This morning your business head said: \"Just make sure nobody says UPBG was late.\"","facts":["Karan in your team keeps the cost-centre codes for every UPBG supplier. A cost-centre code tells Shared Services which business a bill belongs to.","Your business head approved a new summer sales incentive for the AC sales team at the start of this month.","You keep a list of every supplier bill UPBG expects this month, from the purchase orders you raised."]},{"id":"cf","name":"Corp Finance","table":2,"color":"#1f7a4d","job":"You put every business's profit and loss together into one report for the CFO. The headline right now: ₹57 crore operating profit for the month.","sits":"You don't book anything yourselves. Your report is only as good as what every other team sends you. If one team's figure is short, the operating profit in your report is wrong.","map":["Shared Services books the bills suppliers send","Payroll books salaries and sales incentives","IFC approves any cost booked without a bill","UPBG adds it all up into the AC business's profit","Corp Finance adds every business together","The CFO: ₹57 crore operating profit"],"mapnote":"Routine items under ₹25 lakh each, such as hotel bills, partner fees and small Projects bills, were estimated at the start of the month and are already in the ₹57 crore. Booking their bills replaces the estimate, so operating profit doesn't move.","pressure":"The report goes to the CFO at 6 PM, and your name is on it.","facts":["You can see every business's costs this month next to last month's, supplier by supplier.","Last week the CFO said she can work with a range instead of one exact figure, as long as the assumptions are written down.","You can get every team on one call in ten minutes, if you decide to."]},{"id":"ss","name":"Shared Services","table":3,"color":"#b7791f","job":"You record the bills suppliers send to Voltas, for every business. You check each bill, code it to the right business and book it.","sits":"A cost only reaches a business's profit, and the company's operating profit, once you book the bill. A bill that isn't booked makes profit look higher than it really is.","map":["Shared Services books the bills suppliers send","Payroll books salaries and sales incentives","IFC approves any cost booked without a bill","UPBG adds it all up into the AC business's profit","Corp Finance adds every business together","The CFO: ₹57 crore operating profit"],"mapnote":"Routine items under ₹25 lakh each, such as hotel bills, partner fees and small Projects bills, were estimated at the start of the month and are already in the ₹57 crore. Booking their bills replaces the estimate, so operating profit doesn't move.","pressure":"You're measured on booking 95% of bills on time. Your supervisor, Ritu, is on leave, and three businesses are chasing you tonight.","facts":["Your daily queue report shows every bill on hold, with the supplier, the amount and why it's held.","You keep each supplier's contract rates, so you can check that a bill charges the right price.","Arjun, your newest team member, made a coding error last week and is nervous about anything urgent."]},{"id":"pay","name":"Payroll","table":4,"color":"#6b46c1","job":"You work out what employees are paid, including sales incentives, and book that cost to the right business.","sits":"The incentive cost you book goes into each business's profit, and from there into the company's operating profit. You can only use a scheme that's been confirmed to you.","map":["Shared Services books the bills suppliers send","Payroll books salaries and sales incentives","IFC approves any cost booked without a bill","UPBG adds it all up into the AC business's profit","Corp Finance adds every business together","The CFO: ₹57 crore operating profit"],"mapnote":"Routine items under ₹25 lakh each, such as hotel bills, partner fees and small Projects bills, were estimated at the start of the month and are already in the ₹57 crore. Booking their bills replaces the estimate, so operating profit doesn't move.","pressure":"Eleven months without a single payroll error. Nobody wants to be the one who breaks that record.","facts":["You hold the old and new incentive rates whenever a business sends you a scheme.","You receive the monthly sales figures for each sales team automatically from the sales system.","You also process staff expense claims, such as hotel stays during company events."]},{"id":"ifc","name":"Internal Financial Control","table":5,"color":"#b4361f","job":"You are IFC. You check that anything booked without a bill, like an estimate for work already done, is backed by proper evidence and approval.","sits":"A cost without a bill can only go into the books with your sign-off. Without it, the cost stays out of the business's profit and out of the company's operating profit.","map":["Shared Services books the bills suppliers send","Payroll books salaries and sales incentives","IFC approves any cost booked without a bill","UPBG adds it all up into the AC business's profit","Corp Finance adds every business together","The CFO: ₹57 crore operating profit"],"mapnote":"Routine items under ₹25 lakh each, such as hotel bills, partner fees and small Projects bills, were estimated at the start of the month and are already in the ₹57 crore. Booking their bills replaces the estimate, so operating profit doesn't move.","pressure":"Last quarter, an entry rushed through at month-end became an audit finding, and IFC took the blame.","facts":["Your policy: a cost without a bill needs proof the work was done, the agreed rate, and the business head's written confirmation. Review takes 15 minutes.","You get a copy of every system incident report, including Tuesday's system update.","You are copied on approvals for new schemes and policies across Finance."]}];

  async function decrypt(blob, code) {

  }

    const tr = (S.tray && S.tray[c.n]) || {};
    return `<section class="panel"><p class="label">Your in-tray</p>
      <p class="muted" style="font-size:14px">${locked ? "What your table decided." : "Approve or reject each one, as a table. You can change your mind until you lock in, so if another team gives you what you need, come back and update it."}</p>
      <div class="tray">${c.intray[t.id].map((x, i) => `<div class="tx"><p><b>${i + 1}.</b> ${esc(x)}</p>
        <div class="ar">${["approve", "reject"].map(v => `<button data-tx="${i}" data-v="${v}" aria-pressed="${tr[i] === v}" ${locked ? "disabled" : ""}>${v === "approve" ? "✔ Approve" : "✖ Reject"}</button>`).join("")}</div></div>`).join("")}</div></section>`;
  }
  function roundHTML(c, t) {
    const pick = S.picks[c.n];
    const locked = S.locked && S.locked[c.n];
    const ask = (S.asks && S.asks[c.n]) || { teams: [], what: "" };
    const asked = ask.teams, went = !!ask.go;
    const talkLeft = went && !asked.includes("none") ? Math.max(0, Math.ceil((ask.go + TALK_MS - Date.now()) / 1000)) : 0;
    const talked = went && talkLeft === 0 && !asked.includes("none");
    const saved = asked.includes("none") ? went : !!ask.saved;
    const ready = went && talkLeft === 0 && saved;
    const askedNames = asked.includes("none") ? c.ask.none : asked.map(id => TEAMS.find(x => x.id === id).name).join(", ");
    if (locked) {
      return `<section class="result">
        <p class="rl">Round ${c.n} · ${esc(c.title)} · ${c.clock}</p>
        <p class="rq">${esc(c.situation)}</p>
        <p class="rq side2">${esc(c.briefs[t.id])}</p>
        ${c.asks ? `<p class="rl">${esc(c.asks[t.id].who)} asked</p><p class="rq">“${esc(c.asks[t.id].q)}”</p>` : ""}
        <p class="rl">Your team said</p>
        <p class="ra"><b>${"ABC"[pick]}</b> “${esc(c.options[t.id][pick])}”</p>
        ${asked.length ? `<p class="rc">You went to: ${esc(askedNames)}</p>` : ""}${ask.ans && c.qa && c.qa[t.id] && c.qa[t.id][asked[0]] ? `<p class="rl">${esc(c.qa[t.id][asked[0]].q)}</p>${c.qa[t.id][asked[0]].fields.map(([l, u], i) => `<p class="rq">${esc(l)}: ${esc(UF(ask.ans[i], u))}</p>`).join("")}` : ""}${ask.got ? `<p class="rl">What you found out</p><p class="rq">${esc(ask.got)}</p>` : ""}${ask.gave ? `<p class="rl">What you gave them</p><p class="rq">${esc(ask.gave)}</p>` : ""}
        ${c.intray ? `<p class="rl">Your in-tray</p>${c.intray[t.id].map((x, i) => `<p class="rq">${i + 1}. ${(S.tray && S.tray[c.n] || {})[i] === "approve" ? "✔ Approved" : "✖ Rejected"}: ${esc(x)}</p>`).join("")}` : ""}
        <p class="rw">Wait for the next code on the big screen.</p>
      </section>`;
    }
    return `<section class="panel">
      <div class="head"><h2>Round ${c.n} · ${esc(c.title)}</h2><span class="t">${c.clock}</span></div>
      <p class="label">What's happening</p><p>${esc(c.situation)}</p>
      <p class="label">Your side</p><p class="side">${esc(c.briefs[t.id])}</p>
      <p class="label">Someone at your table says</p><p class="quote">“${esc(c.saying[t.id])}”</p>
      <p class="label">Talk · 4 minutes</p>
      <ul class="talk">${c.talk.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <p class="muted">You can talk to anyone in this room.</p>
    </section>
    ${c.has ? `<section class="panel"><p class="label">What your table has right now</p><ul class="has">${c.has[t.id].map(h => `<li>${esc(h)}</li>`).join("")}</ul>${c.need && c.need[t.id] && c.need[t.id].length ? `<p class="label" style="margin-top:14px">What you need to find out</p><ul class="has need">${c.need[t.id].map(q => `<li>${esc(q)}</li>`).join("")}</ul><p class="muted" style="font-size:14px">Another team holds each answer. You can visit one team this round, so choose who.</p>` : ""}</section>` : ""}
    ${saved && !asked.includes("none") ? "" : trayHTML(c, t, false)}
    <section class="panel">
      <p class="label">Before you choose</p>
      <p class="askq">${esc(c.ask.q)}</p>
      ${went ? "" : `<p class="muted" style="font-size:14px">Agree as a table first. One click starts a two-minute timer, and you can't change it.</p>`}
      <div class="chips">${TEAMS.filter(x => x.id !== t.id).map(x => `<button class="chip" data-ask="${x.id}" aria-pressed="${asked.includes(x.id)}" style="--c:${x.color}" ${went ? "disabled" : ""}>${esc(x.name)}</button>`).join("")}<button class="chip none" data-ask="none" aria-pressed="${asked.includes("none")}" ${went ? "disabled" : ""}>${esc(c.ask.none)}</button></div>
      ${went && !asked.includes("none") ? `<div class="goto${talkLeft > 0 ? "" : " done"}"><p><b>You may now go to ${esc(askedNames)} and discuss.</b></p>
        <p class="gt" id="gt">${talkLeft > 0 ? fmt(talkLeft) : "Time's up"}</p>
        <p class="muted" style="font-size:14px">${talkLeft > 0 ? "When the two minutes are up, come back and write down what you got." : "Come back to your table and write down what you got."}</p></div>` : ""}
    </section>
    ${talked ? (() => { const vid = asked[0], qa = c.qa && c.qa[t.id] && c.qa[t.id][vid]; const vals = ask.ans || {};
      return `<section class="panel notes">
      <p class="label">Back at your table</p>
      ${qa ? `<p class="askq">${esc(qa.q)}</p><p class="muted" style="font-size:14px">Write in what ${esc(askedNames)} told you.</p>
        <div class="fields">${qa.fields.map(([l, u, k], i) => `<label class="fld"><span>${esc(l)}</span><span class="row"><input data-f="${i}" inputmode="${k === "time" ? "text" : "decimal"}" placeholder="${k === "time" ? "e.g. 5:00" : "0"}" value="${esc(vals[i] == null ? "" : vals[i])}" ${saved ? "disabled" : ""}><em>${esc(u)}</em></span></label>`).join("")}</div>`
      : `<p class="askq">What did you find out from ${esc(askedNames)}?</p><p class="muted" style="font-size:14px">${esc(askedNames)} didn't hold the answer to anything on your list this round. Write down what you learned.</p>
        <textarea id="got" rows="3" placeholder="What they told you" ${saved ? "disabled" : ""}>${esc(ask.got || "")}</textarea>`}
      <p class="askq" style="margin-top:12px">What did you give them? <span class="muted" style="font-weight:400;font-size:14px">(if anything)</span></p>
      <textarea id="gave" rows="2" placeholder="What you told them, showed them or sent them" ${saved ? "disabled" : ""}>${esc(ask.gave || "")}</textarea>
      ${saved ? `<p class="muted" style="font-size:14px">Saved. Now update your in-tray below with what you learned, then answer the question.</p>` : `<button class="btn" id="savegot" disabled>Save and continue</button>`}
    </section>`; })() : ""}
    ${saved && !asked.includes("none") ? trayHTML(c, t, false) : ""}
    ${ready ? `<section class="panel">
      ${c.asks ? `<p class="label">${esc(c.asks[t.id].who)} asks you</p><p class="quote">“${esc(c.asks[t.id].q)}”</p><p>What would your team say? Choose one, as a team.</p>` : `<p class="label">Choose one, as a team</p><p>Which is closest to what your team would actually say?</p>`}
      <div class="opts">${c.options[t.id].map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="${pick === i}"><b>${"ABC"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
      ${pick === undefined ? `<p class="muted" style="font-size:14px">Agree as a team first. Then choose your answer and lock it in.</p>` : trayLeft(c, t) ? `<p class="muted" style="font-size:14px">Approve or reject ${trayLeft(c, t)} more in-tray item${trayLeft(c, t) > 1 ? "s" : ""} above before you lock in.</p>` : `<button class="btn lock" id="lock">Lock in ${"ABC"[pick]} and our in-tray</button><p class="muted" style="font-size:14px">You can't change either after this.</p>`}
    ` : `<section class="panel"><p class="muted" style="text-align:center">${!went ? "Answer the question above to see your three responses." : talkLeft > 0 ? "Your three responses open after the two minutes, once you've written down what you got." : "Write down what you got, then your three responses open."}</p>`}
    </section>`;
  }
  function cfoHTML(c) {
    return `<section class="panel">
      <div class="head"><h2>The CFO call</h2><span class="t">6:00 PM</span></div>
      <p class="label">The CFO asks</p><p class="big">“${esc(c.line)}”</p>
      <p class="label">Agree as a team</p>
      <ul class="talk">${c.prompts.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
      <p class="muted">Your spokesperson answers when the CFO calls your table.</p>
    </section>`;
  }
  function revealHTML(c, t) {
    const zoneOf = k => c.kinds[k].zone;
    return `<section class="panel">
      <button type="button" class="icelink" aria-label="Show the picture full size"><img class="ice" src="${LINE_IMG}" alt="An iceberg. Above the waterline: Acknowledge, Own, Act. You move the outcome forward. Below the waterline: Blame, Defend, Wait. You stay stuck."></button>
      <p class="muted" style="font-size:13px;margin-top:-4px">Click the picture to see it full size. On a phone, turn it sideways to read it.</p>
      <p class="muted" style="font-size:14px">Amber sits on the line: true, or doing our own part, but the outcome doesn't move.</p>
    </section>
    ${[1, 2, 3].map(n => `<section class="panel">
      <p class="label">Round ${n} · ${esc(c.themes[n])}</p>
      ${S.asks && S.asks[n] && S.asks[n].teams.length ? `<p class="muted" style="font-size:14px">You went to: ${esc(S.asks[n].teams.includes("none") ? "no one" : S.asks[n].teams.map(id => TEAMS.find(x => x.id === id).name).join(", "))}</p>${(() => { const a = S.asks[n], vid = a.teams[0], qa = c.qa && c.qa[n] && c.qa[n][t.id] && c.qa[n][t.id][vid];
        if (qa && a.ans) return `<div class="tx"><p><b>${esc(qa.q)}</b></p>${qa.fields.map(([l, ans, u, k], i) => { const ok = same(a.ans[i], ans, k); return `<p class="verdict"><b class="${ok ? "ok" : "no"}">${ok ? "Right" : "Not quite"}</b>${esc(l)}: you wrote ${esc(a.ans[i] ? UF(a.ans[i], u) : "nothing")}. The answer: ${esc(UF(fmtAns(ans, k), u))}.</p>`; }).join("")}</div>`;
        if (a.got) return `<p class="muted" style="font-size:14px">You found out: ${esc(a.got)}</p>`;
        return ""; })()}` : ""}
      ${c.qa && c.qa[n] ? (() => { const all = Object.entries(c.qa[n][t.id] || {}); return all.length ? `<p class="label">What you needed to find out this round</p>${all.map(([f, x]) => `<p class="muted" style="font-size:14px">${esc(x.q)} <b>${esc(TEAMS.find(y => y.id === f).name)}</b> had it: ${x.fields.map(([l, ans, u, k]) => `${esc(l)} ${esc(UF(fmtAns(ans, k), u))}`).join(", ")}.</p>`).join("")}` : ""; })() : ""}
      ${c.intray ? `<p class="label">Your in-tray</p><div class="tray">${c.intray[n][t.id].map((x, i) => { const mine = ((S.tray && S.tray[n]) || {})[i]; const good = mine && (x.right === mine || (x.right === "approve-after" && mine === "approve"));
        return `<div class="tx"><p><b>${i + 1}.</b> ${esc(x.text)}</p><p class="verdict"><b class="${good ? "ok" : "no"}">${mine ? (mine === "approve" ? "You approved" : "You rejected") : "No decision"}</b>Right call: ${x.right === "approve" ? "approve. " : x.right === "reject" ? "reject. " : ""}${esc(x.why)}</p></div>`; }).join("")}</div><p class="label">Your answer</p>` : ""}
      <div class="rv">${c.order[n][t.id].map((k, i) => { const z = c.zones[zoneOf(k)]; const mine = S.picks[n] === i && S.locked && S.locked[n];
        return `<div class="row${mine ? " mine" : ""}" style="--k:${c.kinds[k].color}"><b>${"ABC"[i]}</b><span>
          <span class="tags"><span class="k">${esc(c.kinds[k].label)}</span><span class="z">${esc(z.label)}</span>${mine ? `<span class="you">Your team's answer</span>` : ""}</span>
          <span class="st">“${esc(c.options[n][t.id][i])}”</span>
          <span class="muted mean">${esc(c.kinds[k].meaning)}</span></span></div>`; }).join("")}</div>
    </section>`).join("")}`;
  }

  function render() {
    try { renderInner(); } catch (err) {
      console.error(err);
      $("#app").innerHTML = `<section class="start"><h1>The 6 PM Number</h1><p>Something on this screen is out of date.</p><button class="btn" id="rs">Start fresh</button></section>`;
      $("#rs").onclick = () => { try { store && store.removeItem(STORE); } catch (e) {} location.replace(location.pathname + "?reset"); };
    }
  }
  const WIDE = window.matchMedia ? matchMedia("(min-width: 960px)") : { matches: false };
  function renderInner() {
    const t = team();
    const wide = WIDE.matches;
    $("#app").classList.toggle("wide", wide && !!t);
    if (!t) return startView();
    document.documentElement.style.setProperty("--team", t.color);
    const opened = ORDER.filter(n => S.open[n]);
    if (S.tab !== "card" && !S.open[S.tab]) S.tab = latest() || "now";
    if (wide && S.tab === "card" && opened.length) S.tab = latest();
    const tabs = [...(wide ? [] : [["card", "Our card"]]), ...opened.map(n => [n, NAME[n]])];
    let body = "", shade = null;
    const waitMsg = `<div class="wait">Read your team card together as a table.<br>When a round starts, type the code from the big screen ${wide ? "here" : "above"}.</div>`;
    if (wide && !opened.length) {
      body = waitMsg;
    } else if (S.tab === "card" || (!opened.length)) {
      body = (opened.length ? "" : waitMsg) + cardHTML(t);
    } else {
      const c = S.open[S.tab];
      body = c.kind === "round" ? roundHTML(c, t) : c.kind === "cfo" ? cfoHTML(c) : revealHTML(c, t);
      if (c.kind === "round" && S.locked && S.locked[c.n]) shade = c.colors[c.kinds[t.id][S.picks[c.n]]];
    }
    const done = ORDER.every(n => S.open[n]);
    const band = `<div class="band"><div><small>${S.me ? esc(S.me.split(" ")[0]) + " · " : ""}Table ${t.table}</small><h2>${esc(t.name)}</h2></div><button id="chg" type="button">Change table</button></div>`;
    const codeForm = done ? "" : `<form class="code" id="cf" autocomplete="off"><input id="ci" placeholder="Code on the screen" aria-label="Code from the big screen" enterkeyhint="go"><button class="btn">Open</button></form><p class="msg" id="cm"></p>`;
    const nav = opened.length ? `<nav class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" aria-pressed="${String(S.tab) === String(k)}">${l}</button>`).join("")}</nav>` : "";
    $("#app").innerHTML = wide
      ? `<div class="cols"><aside>${band}${cardHTML(t)}</aside><div class="main">${codeForm}${nav}${body}</div></div>`
      : `${band}${codeForm}${nav}${body}`;
    document.body.style.background = shade || ""; document.documentElement.style.background = shade || "";
    document.body.classList.toggle("shaded", !!shade);
    $("#chg").onclick = () => { S = fresh(); step = roster ? "pick" : "event"; save(); render(); scrollTo(0, 0); };
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab === "card" ? "card" : +b.dataset.tab; save(); render(); scrollTo(0, 0); });
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => { S.picks[S.tab] = +b.dataset.i; save(); render(); $("#lock") && $("#lock").scrollIntoView({ block: "center" }); });
    document.querySelectorAll("[data-tx]").forEach(b => b.onclick = () => {
      S.tray = S.tray || {}; S.tray[S.tab] = S.tray[S.tab] || {}; S.tray[S.tab][+b.dataset.tx] = b.dataset.v; save(); const y = scrollY; render(); scrollTo(0, y);
    });
    const sg = $("#savegot");
    if (sg) { const gotEl = $("#got"), fs = [...document.querySelectorAll("[data-f]")];
      const chk = () => { sg.disabled = gotEl ? gotEl.value.trim().length < 3 : fs.some(f => !f.value.trim()); };
      (gotEl ? [gotEl] : fs).forEach(el => el.oninput = chk); chk();
      sg.onclick = () => { const a = S.asks[S.tab]; if (gotEl) a.got = gotEl.value.trim(); else a.ans = fs.map(f => f.value.trim());
        a.gave = ($("#gave").value || "").trim(); a.saved = true; save(); render(); const tr = $(".tray"); tr && tr.scrollIntoView({ block: "start" }); }; }
    const lk = $("#lock");
    if (lk) lk.onclick = () => { S.locked = S.locked || {}; S.locked[S.tab] = true; save(); render(); scrollTo(0, 0); };
    document.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => {
      S.asks = S.asks || {}; if (S.asks[S.tab] && S.asks[S.tab].go) return;
      S.asks[S.tab] = { teams: [b.dataset.ask], go: Date.now() }; save(); const y = scrollY; render(); scrollTo(0, y);
    });
    clearInterval(window.__talk);
    if ($("#gt") && !$(".goto.done")) window.__talk = setInterval(() => {
      const a = S.asks[S.tab]; if (!a || !a.go) return clearInterval(window.__talk);
      const left = Math.max(0, Math.ceil((a.go + TALK_MS - Date.now()) / 1000));
      if (left > 0) { const el = $("#gt"); if (el) el.textContent = fmt(left); }
      else { clearInterval(window.__talk); const y = scrollY; render(); scrollTo(0, y); }
    }, 500);
    const f = $("#cf");
    if (f) f.onsubmit = async e => {
      e.preventDefault();
      const code = $("#ci").value.trim().toUpperCase().replace(/\s+/g, "");
      if (!code) return;
      const m = $("#cm"); m.className = "msg"; m.textContent = "Opening…";
      for (const blob of BLOBS) {
        try { const c = await decrypt(blob, code); S.open[c.n] = c; S.tab = c.n; save(); render(); scrollTo(0, 0); return; } catch (err) {}
      }
      m.className = "msg err"; m.textContent = "That code didn't work. Check the big screen and try again.";
    };
  }
  document.addEventListener("click", e => {
    if (e.target.closest(".icelink")) { const z = document.createElement("div"); z.className = "zoom"; z.innerHTML = `<img src="${LINE_IMG}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z); }
  });
  if (WIDE.addEventListener) WIDE.addEventListener("change", () => render());
  render();
})();
</script>
</body>
</html>
