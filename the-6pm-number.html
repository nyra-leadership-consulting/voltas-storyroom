<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Operation: Family Vacation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0c131b; --panel:#141e29; --panel-2:#1b2836; --line:#2a3a4b; --ink:#e8eef4; --muted:#93a4b5;
  --amber:#f2a93b; --team:#2563a8;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.start{display:grid;gap:18px;padding-top:12px}
.start .kick{font-family:var(--mono);font-size:14px;color:var(--amber);letter-spacing:.06em}
.start h1{font-size:42px}
.roles{display:grid;gap:10px}
.rbtn{display:grid;gap:2px;text-align:left;border:0;border-radius:14px;padding:16px 18px;color:#fff;cursor:pointer;font-weight:700;font-size:22px;font-family:var(--display)}
.rbtn small{font-family:var(--body);font-size:14px;font-weight:500;opacity:.9}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start;padding:4px 0;font-size:15px}
.band{background:var(--team);border-radius:14px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.band h2{font-size:28px}
.band small{display:block;font-size:14px;opacity:.9}
.code{display:grid;grid-template-columns:1fr auto;gap:8px}
.code input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:19px;text-transform:uppercase;letter-spacing:.08em;min-width:0}
.code input::placeholder{text-transform:none;letter-spacing:normal;font-family:var(--body)}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--amber);color:#1a1205}
.msg{font-size:14px;min-height:20px;color:var(--muted)}
.msg.err{color:#ff8f7a}
.msg.ok{color:#7fd6a3}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--amber);color:#1a1205;font-size:12px;font-weight:700;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:10px}
.panel h3{font-size:22px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--team);filter:brightness(1.7);margin-top:4px}
ul.b{margin:0;padding-left:20px;display:grid;gap:6px}
.dead{border-left:4px solid var(--amber);padding:8px 12px;background:var(--panel-2);border-radius:0 10px 10px 0;font-weight:600}
.win{font-style:italic;color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td:first-child{font-weight:600}
tr.me td{background:color-mix(in srgb,var(--team) 30%,transparent)}
.scroll{overflow-x:auto}
.mcard{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.mcard header{background:var(--team);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mcard header h3{font-size:22px}
.mcard header small{font-family:var(--mono);font-size:12px;opacity:.85;white-space:nowrap}
.mcard .body{padding:14px 16px;display:grid;gap:10px;font-size:18px}
.mcard.new{outline:3px solid var(--amber);outline-offset:2px}
.wait{text-align:center;padding:22px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.map{display:grid;gap:10px}
.map .row{background:var(--panel-2);border-radius:10px;padding:12px;border-left:5px solid var(--k)}
.map .row b{display:block;font-family:var(--display);font-size:19px}
.map .row.mine{outline:2px solid var(--ink)}
textarea{width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:17px}
.paper{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
@media (min-width:960px){ body{font-size:18px} .wrap{max-width:760px;padding-top:28px} }
</style>
</head>

  const STORE = "fv-live-v1";
  const BUILD = "mv6p7ajl";
  const store = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fresh = () => ({ joined: false, role: null, msgs: [], debrief: null, tab: "card", seen: 0, note: "", build: BUILD });
  let S = fresh();
  try { S = Object.assign(S, JSON.parse((store && store.getItem(STORE)) || "{}")); } catch (e) {}
  if (S.build !== BUILD) S = Object.assign(fresh(), { joined: S.joined, role: S.role });
  if (/[?&]reset\b/.test(location.search)) { S = fresh(); history.replaceState(null, "", location.pathname); }
  const save = () => { try { store && store.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
  const role = () => ROLES.find(r => r.id === S.role);

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(blob, code) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(blob.s), iterations: 120000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.i) }, key, b64(blob.c))));
  }
  const clean = v => v.trim().toUpperCase().replace(/\s+/g, "");

  function render() {
    document.documentElement.style.setProperty("--team", role() ? role().color : "#2563a8");
    const app = $("#app");
    if (!S.joined) return eventView(app);
    if (!S.role) return roleView(app);
    gameView(app);
  }

  function eventView(app) {
    app.innerHTML = `<section class="start">
      <div class="kick">VOLTAS · OWNERSHIP AND ACCOUNTABILITY</div>
      <h1>Operation: Family Vacation</h1>
      <p class="muted">Enter the event code shown on the big screen.</p>
      <form class="code" id="ef" autocomplete="off"><input id="ei" placeholder="Event code" aria-label="Event code" enterkeyhint="go"><button class="btn">Next</button></form>
      <p class="msg" id="em"></p></section>`;
    $("#ef").onsubmit = async e => {
      e.preventDefault();
      const m = $("#em"); m.className = "msg"; m.textContent = "Checking…";
      try { await decrypt(EVENT_BLOB, clean($("#ei").value)); S.joined = true; save(); render(); }
      catch (err) { m.className = "msg err"; m.textContent = "That code didn't work. Check the big screen."; }
    };
  }

  let picking = null;
  function roleView(app) {
    if (picking) {
      const r = ROLES.find(x => x.id === picking);
      document.documentElement.style.setProperty("--team", r.color);
      app.innerHTML = `<section class="start">
        <div class="kick">CHECK YOUR TABLE</div>
        <h1>You're ${esc(r.dept)}, playing ${esc(r.short)}</h1>
        <p>Everyone at your table plays the same role. Your role card is private, so keep your screen to your own table.</p>
        <p class="muted">Once you confirm, you can't switch roles without your facilitator.</p>
        <button class="btn" id="yes">Yes, I'm at the ${esc(r.dept)} table</button>
        <button class="link" id="no">Go back</button></section>`;
      $("#yes").onclick = () => { S.role = picking; picking = null; S.tab = "card"; save(); render(); scrollTo(0, 0); };
      $("#no").onclick = () => { picking = null; render(); };
      return;
    }
    app.innerHTML = `<section class="start">
      <div class="kick">VOLTAS · OWNERSHIP AND ACCOUNTABILITY</div>
      <h1>Which team are you in?</h1>
      <p class="muted">Pick your department. The sign on your table shows it.</p>
      <div class="roles">${ROLES.map(r => `<button class="rbtn" style="background:${r.color}" data-r="${r.id}">${esc(r.dept)}<small>plays ${esc(r.short)} · ${esc(r.tag)}</small></button>`).join("")}</div></section>`;
    app.querySelectorAll(".rbtn").forEach(b => b.onclick = () => { picking = b.dataset.r; render(); });
  }

  const list = a => `<ul class="b">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const tbl = (head, rows, meRow) => `<div class="scroll"><table>${head ? `<tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>` : ""}${rows.map(r => `<tr${meRow && meRow(r) ? ' class="me"' : ""}>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;

  function cardView(r) {
    let h = `<section class="panel">
      <div class="sec">Your situation</div>${r.story.map(s => `<p>${esc(s)}</p>`).join("")}
      <div class="sec">The trip</div><p class="muted">${esc(COMMON.trip)}</p>
      <div class="sec">What you hold</div>${list(r.hold)}`;
    if (r.know.length) h += `<div class="sec">What you know</div>${list(r.know)}`;
    if (r.budget) h += `<div class="sec">The family budget</div>${tbl(["Line", "Amount", "Status"], r.budget)}`;
    if (r.file) h += `<div class="sec">Your booking file</div>${tbl(null, r.file)}`;
    if (r.prices) h += `<div class="sec">Sundarpur price list</div>${tbl(["Activity", "Price", "Who can go"], r.prices)}`;
    h += `<div class="sec">Your deadlines</div>${r.deadlines.map(d => `<div class="dead">${esc(d)}</div>`).join("")}
      <div class="sec">Your rules</div>${list(r.rules)}
      <div class="sec">Team jobs · agree these while you read</div>${tbl(null, COMMON.jobs)}
      <div class="sec">You've done well if</div><p class="win">${esc(r.win)}</p>
      <p class="paper">Money and signed slips are on paper at your table. All payments go through the vendor desk at the front.</p></section>`;
    return h;
  }
  function rulesView(r) {
    return `<section class="panel"><h3>Who can do what</h3><p class="muted">Every table has this same table. Your row is highlighted.</p>
      ${tbl(null, COMMON.authority, row => row[0] === r.authKey)}</section>`;
  }
  function msgsView(r) {
    if (!S.msgs.length) return `<div class="wait">No messages yet.<br>When the big screen shows a code for your table, type it above.</div>`;
    return [...S.msgs].reverse().map((m, i) => `<article class="mcard${i === 0 && S.fresh ? " new" : ""}"><header><h3>${esc(m.head)}</h3><small>Message ${m.n}</small></header>
      <div class="body">${m.body.map(b => `<p>${esc(b)}</p>`).join("")}</div></article>`).join("");
  }
  function debriefView(r) {
    const d = S.debrief;
    return `<section class="panel"><h3>Where this happens at Voltas</h3>
      <div class="map">${d.map.map(row => `<div class="row${row.id === r.id ? " mine" : ""}" style="--k:${row.color}"><b>${esc(row.team)} · played ${esc(row.family)}</b><span class="muted">${esc(row.voltas)}</span><br><span>${esc(row.moment)}</span></div>`).join("")}</div></section>
      <section class="panel"><h3>Your commitment</h3><p class="muted">It stays on this phone.</p>
      ${d.commit.map((c, k) => `<label class="sec" for="n${k}">${esc(c)}</label><textarea id="n${k}" data-k="${k}">${esc((S.notes || [])[k] || "")}</textarea>`).join("")}</section>`;
  }

  function gameView(app) {
    const r = role();
    const tabs = [["card", "My role"], ["msgs", "Messages"], ["rules", "Who can do what"]];
    if (S.debrief) tabs.push(["debrief", "Debrief"]);
    const unseen = S.msgs.length - S.seen;
    app.innerHTML = `<header class="band"><div><h2>${esc(r.dept)}</h2><small>Playing ${esc(r.short)} · ${esc(r.tag)}</small></div></header>
      <form class="code" id="cf" autocomplete="off"><input id="ci" placeholder="Code from the big screen" aria-label="Code from the big screen" enterkeyhint="go"><button class="btn">Open</button></form>
      <p class="msg" id="cm"></p>
      <nav class="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" aria-pressed="${S.tab === k}">${l}${k === "msgs" && unseen > 0 && S.tab !== "msgs" ? `<span class="dot">${unseen}</span>` : ""}</button>`).join("")}</nav>
      <div id="view">${S.tab === "card" ? cardView(r) : S.tab === "msgs" ? msgsView(r) : S.tab === "rules" ? rulesView(r) : debriefView(r)}</div>`;
    if (S.tab === "msgs") { S.seen = S.msgs.length; S.fresh = false; save(); }
    app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.t; save(); render(); });
    document.querySelectorAll("textarea[data-k]").forEach(t => t.oninput = () => { S.notes = S.notes || []; S.notes[+t.dataset.k] = t.value; save(); });
    $("#cf").onsubmit = async e => {
      e.preventDefault();
      const code = clean($("#ci").value), m = $("#cm");
      if (!code) return;
      if (code === "RESET") { S = Object.assign(fresh(), { joined: true }); save(); render(); return; }
      m.className = "msg"; m.textContent = "Opening…";
      for (const blob of BLOBS) {
        let c; try { c = await decrypt(blob, code); } catch (err) { continue; }
        if (c.kind === "debrief") { S.debrief = c; S.tab = "debrief"; save(); render(); scrollTo(0, 0); return; }
        if (c.to !== S.role) { m.className = "msg err"; m.textContent = "That message is for another table. It won't open here."; return; }
        if (!S.msgs.some(x => x.n === c.n)) { S.msgs.push(c); S.msgs.sort((a, b) => a.n - b.n); }
        S.tab = "msgs"; S.fresh = true; save(); render(); scrollTo(0, 0); return;
      }
      m.className = "msg err"; m.textContent = "That code didn't work. Check the big screen and try again.";
    };
  }
  render();
})();
</script>
