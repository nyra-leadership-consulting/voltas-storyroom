<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 6 PM Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Late-evening finance floor: deep navy, an amber clock, each team's colour as its identity. */
:root{
  --bg:#0c131b; --panel:#141e29; --panel-2:#1b2836; --line:#2a3a4b; --ink:#e8eef4; --muted:#93a4b5;
  --amber:#f2a93b; --team:#2563a8;
  --blame:#c8432b; --explain:#d69a1f; --own:#2f9a63;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:18px 40px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.brand span{font-family:var(--mono);font-size:12px;color:var(--amber)}
.hero{padding:26px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;gap:10px}
.hero .clock{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--amber);letter-spacing:-.02em}
.hero h1{font-size:38px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted)}
.field{display:grid;gap:6px}
.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-size:18px;width:100%}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--amber);color:#1a1205}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);font-weight:600}
.err{color:#ff8f7a;font-size:14px;min-height:20px}

.id{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.id .band{background:var(--team);padding:18px 18px 16px;display:grid;gap:4px;color:#fff}
.id .band small{font-family:var(--mono);font-size:12px;opacity:.85}
.id .band h2{font-size:34px}
.id .band .tbl{font-family:var(--display);font-size:20px;font-weight:700}
.id .body{padding:16px;display:grid;gap:12px}
.fact{border-left:4px solid var(--team);background:var(--panel-2);border-radius:0 10px 10px 0;padding:10px 12px}
.kpi{display:flex;gap:8px;align-items:center;font-weight:600}
.kpi i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--bg);background:var(--amber);border-radius:4px;padding:1px 6px}
.wait{text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}

.codebar{display:grid;grid-template-columns:1fr auto;gap:8px}
.codebar input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px 14px;font-family:var(--mono);font-size:18px;text-transform:uppercase;letter-spacing:.08em;min-width:0}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--team);border-color:var(--team);color:#fff}

.round .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.round .top .clock{font-family:var(--mono);color:var(--amber);font-weight:700;font-size:22px}
.round h2{font-size:30px}
.since{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.headline{font-size:18px;font-weight:500}
.hit{display:inline-block;background:var(--amber);color:#1a1205;font-weight:700;font-size:13px;border-radius:6px;padding:3px 9px;justify-self:start}
.brief{font-size:17px}
.qs{margin:0;padding-left:22px;display:grid;gap:6px}
.cfo{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.cfo small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:0;border-radius:12px;padding:16px 6px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;color:#fff;cursor:pointer}
.rate .b{background:var(--blame)} .rate .e{background:var(--explain)} .rate .o{background:var(--own)}
details summary{cursor:pointer;font-weight:600}
details .fact{margin-top:8px}

.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;padding:24px}
.overlay b{font-family:var(--display);font-size:clamp(64px,22vw,140px);font-weight:800;letter-spacing:.04em;line-height:1}
.overlay span{display:block;font-size:16px;margin-top:14px;opacity:.85}

.final .q{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--amber);color:#1a1205;border-color:var(--amber)}
textarea{width:100%;min-height:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font:inherit;resize:vertical}
.foot{text-align:center;font-size:13px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>THE 6 PM NUMBER</b><span id="whoTop"></span></div>

  <!-- JOIN -->
  <section id="vJoin" class="wrap" style="padding:0">
    <div class="hero">
      <div class="clock">4:00 PM</div>
      <h1>Can your function protect the business outcome?</h1>
      <p class="muted">The CFO needs one number she can stand behind by 6 PM. Five finance functions hold a piece of the answer.</p>
    </div>
    <div class="panel">
      <div class="field"><label class="label" for="inName">Your name</label><input id="inName" autocomplete="name" placeholder="First name"></div>
      <div class="field"><label class="label" for="inNum">Your number</label><input id="inNum" inputmode="numeric" placeholder="1 to 25"><span class="muted" style="font-size:14px">The facilitator will ask the room to count off. Enter the number you called out.</span></div>
      <div class="err" id="joinErr"></div>
      <button class="btn" id="joinBtn">Start</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="vPlay" hidden style="display:grid;gap:14px">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
    <div class="panel" id="codePanel">
      <label class="label" for="inCode" id="codeLabel">Enter the code on the big screen</label>
      <div class="codebar"><input id="inCode" autocomplete="off" autocapitalize="characters" placeholder="CODE"><button class="btn" id="codeBtn">Open</button></div>
      <div class="err" id="codeErr"></div>
    </div>
    <div class="foot"><button id="resetBtn">Not you? Change name or number</button></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden role="button" tabindex="0" aria-label="Close"><div><b id="ovWord"></b><span>Hold your phone up. Tap to close.</span></div></div>

(function(){
  const $=s=>document.querySelector(s);
  const KEY="sixpm.v1";
  const load=()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } };
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };
  let state=load(); state.codes=state.codes||{}; state.final=state.final||{};
  const unlocked={};      // n -> decrypted content
  let current=null;       // "home" | round n | "final"

  function who(){ const n=state.num; const t=TEAMS[Math.floor((n-1)/5)]; return {team:t, person:((n-1)%5)+1}; }
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- crypto ----------
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function decrypt(blob,code){
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(blob.s),iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.i)},key,b64(blob.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function tryCode(raw){
    const code=raw.trim().toUpperCase().replace(/\s+/g,"");
    if(!code) return null;
    for(const b of BLOBS){
      if(unlocked[b.n]) continue;
      try{ const c=await decrypt(b,code); unlocked[b.n]=c; state.codes[b.n]=code; save(); return b.n; }catch(e){}
    }
    for(const b of BLOBS){ if(state.codes[b.n]===code) return b.n; }
    return null;
  }

  // ---------- join ----------
  $("#joinBtn").addEventListener("click",()=>{
    const name=$("#inName").value.trim(), num=parseInt($("#inNum").value,10);
    if(!name){ $("#joinErr").textContent="Please enter your name."; return; }
    if(!(num>=1&&num<=25)){ $("#joinErr").textContent="Enter the number you called out, from 1 to 25."; return; }
    state.name=name; state.num=num; save(); startPlay();
  });
  $("#resetBtn").addEventListener("click",()=>{ state={codes:state.codes,final:{}}; delete state.name; delete state.num; save(); $("#vPlay").hidden=true; $("#vJoin").hidden=false; $("#whoTop").textContent=""; document.documentElement.style.removeProperty("--team"); });

  async function startPlay(){
    const w=who();
    document.documentElement.style.setProperty("--team",w.team.color);
    $("#whoTop").textContent=state.name+" · "+w.team.name;
    $("#vJoin").hidden=true; $("#vPlay").hidden=false;
    for(const b of BLOBS){ const c=state.codes[b.n]; if(c&&!unlocked[b.n]){ try{ unlocked[b.n]=await decrypt(b,c); }catch(e){} } }
    const opened=Object.keys(unlocked).map(Number).sort((a,b)=>a-b);
    show(opened.length? opened[opened.length-1] : "home");
  }

  // ---------- views ----------
  function tabs(){
    const items=[["home","My role"]];
    Object.keys(unlocked).map(Number).sort((a,b)=>a-b).forEach(n=>items.push([n, n===6?"6 PM":"Round "+n]));
    $("#tabs").innerHTML=items.map(([k,l])=>`<button data-k="${k}" aria-current="${String(k)===String(current)}">${l}</button>`).join("");
    $("#tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.k==="home"?"home":Number(b.dataset.k))));
  }
  function myFact(){ const w=who(); return PEOPLE[w.team.id][w.person-1]; }
  function nextLabel(){
    const opened=Object.keys(unlocked).map(Number);
    const max=opened.length?Math.max(...opened):0;
    $("#codeLabel").textContent = max===0 ? "When the facilitator starts Round 1, enter the code on the big screen" : max>=6 ? "Enter a code if the facilitator asks you to" : "When the next round starts, enter the new code";
  }
  function show(k){
    current=k; tabs(); nextLabel();
    const w=who(), v=$("#view");
    if(k==="home"){
      v.innerHTML=`<div class="id"><div class="band"><small>YOUR FUNCTION</small><h2>${esc(w.team.name)}</h2><div class="tbl">Person ${w.person} · Table ${w.team.table}</div></div>
        <div class="body">
          <p><strong>Find your four teammates at Table ${w.team.table}.</strong></p>
          <div><div class="label">Your objective</div><p>${esc(OBJECTIVE)}</p></div>
          <div><div class="label">Your function</div><p>${esc(w.team.role)}</p></div>

          <div><div class="label">What you know</div><div class="fact">${esc(myFact())}</div><p class="muted" style="font-size:14px;margin-top:6px">Only you have this. Your teammates each hold something different.</p></div>
          <div><div class="label">Remember</div><p>You are responsible for your function's output. You are not responsible for everyone else's work.</p></div>
          <div class="wait">Wait for the facilitator</div>
        </div></div>`;
      return;
    }
    const c=unlocked[k];
    if(k===6){
      const f=state.final[w.team.id]||{};
      v.innerHTML=`<div class="panel final"><div class="round"><div class="top"><span class="label">THE CFO CALL</span><span class="clock">${esc(c.clock)}</span></div></div>
        <h2>The CFO wants one answer</h2>
        <p class="muted">Agree this as a team. Your spokesperson reads it out when the facilitator calls ${esc(w.team.name)}.</p>
        <div><div class="label">The CFO asks ${esc(w.team.name)}</div><p class="q">${esc(c.questions[w.team.id])}</p></div>
        <div class="field"><label class="label" for="fNum">Our number</label><input id="fNum" placeholder="₹ crore" value="${esc(f.num||"")}"></div>
        <div><div class="label">Our confidence</div><div class="chips" id="fConf">${["Low","Medium","High"].map(x=>`<button aria-pressed="${f.conf===x}">${x}</button>`).join("")}</div></div>
        <div class="field"><label class="label" for="fAct">What we are willing to own</label><textarea id="fAct" placeholder="We will...">${esc(f.act||"")}</textarea></div>
      </div>`;
      const put=()=>{ state.final[w.team.id]={num:$("#fNum").value,conf:(v.querySelector('#fConf [aria-pressed="true"]')||{}).textContent,act:$("#fAct").value}; save(); };
      $("#fNum").addEventListener("input",put); $("#fAct").addEventListener("input",put);
      v.querySelectorAll("#fConf button").forEach(b=>b.addEventListener("click",()=>{ v.querySelectorAll("#fConf button").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); put(); }));
      return;
    }
    const hit=c.hit===w.team.id;
    v.innerHTML=`<div class="panel round">
        <div class="top"><span class="label">ROUND ${c.n}</span><span class="clock">${esc(c.clock)}</span></div>
        <h2>${esc(c.title)}</h2>
        ${c.since?`<p class="since"><strong>Since the last round:</strong> ${esc(c.since)}</p>`:""}
        <p class="headline">${esc(c.headline)}</p>
      </div>
      <div class="panel" style="border-color:var(--team)">
        <div class="label" style="color:var(--team);filter:brightness(1.6)">${esc(w.team.name)}</div>
        ${hit?`<span class="hit">This one has landed on your team</span>`:""}
        <p class="brief">${esc(c.briefs[w.team.id])}</p>
        <details><summary>What you know</summary><div class="fact">${esc(myFact())}</div></details>
      </div>
      <div class="panel"><div class="label">Discuss as a team</div><ol class="qs">${c.discuss.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>
      <div class="panel"><p class="cfo"><small>The CFO asks</small>“${esc(c.cfo)}”</p></div>
      ${c.n>=2?`<div class="panel"><div class="label">When the facilitator asks you to rate a response</div><div class="rate"><button class="b" data-r="BLAME">BLAME</button><button class="e" data-r="EXPLAIN">EXPLAIN</button><button class="o" data-r="OWN">OWN</button></div></div>`:""}`;
    v.querySelectorAll(".rate button").forEach(b=>b.addEventListener("click",()=>{ const col={BLAME:"var(--blame)",EXPLAIN:"var(--explain)",OWN:"var(--own)"}[b.dataset.r]; $("#overlay").style.background=col; $("#ovWord").textContent=b.dataset.r; $("#overlay").hidden=false; }));
    window.scrollTo({top:0,behavior:"smooth"});
  }
  $("#overlay").addEventListener("click",()=>{$("#overlay").hidden=true;});
  $("#overlay").addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key==="Escape") $("#overlay").hidden=true; });

  async function submitCode(){
    $("#codeErr").textContent="Checking…"; $("#codeBtn").disabled=true;
    const n=await tryCode($("#inCode").value);
    $("#codeBtn").disabled=false;
    if(n===null){ $("#codeErr").textContent="That code didn't work. Check the big screen and try again."; return; }
    $("#codeErr").textContent=""; $("#inCode").value=""; show(n);
  }
  $("#codeBtn").addEventListener("click",submitCode);
  $("#inCode").addEventListener("keydown",e=>{ if(e.key==="Enter") submitCode(); });

  if(state.name&&state.num) startPlay();
})();
</script>
</body>
</html>
