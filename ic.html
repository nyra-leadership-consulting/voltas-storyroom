<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Voltas Story Room</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14212d;--muted:#5b6b7a;--line:#d5dce3}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#17212b;--ink:#e6edf3;--muted:#9aabba;--line:#2c3a47;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:520px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
h1{margin:0 0 10px;font-size:26px}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>The Voltas Story Room</h1>
<p>This activity isn't open yet. Your facilitator will let you know when it's ready.</p>
</main>
</body>
</html>
