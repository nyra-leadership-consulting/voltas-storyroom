<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voltas Story Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14212d;--muted:#5b6b7a;--line:#d5dce3;--accent:#0d5c8f}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--surface:#17212b;--ink:#e6edf3;--muted:#9aabba;--line:#2c3a47;--accent:#5aa9df;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{max-width:640px;width:100%;display:grid;gap:18px}
h1{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:34px;margin:0}
p{margin:0;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.links{grid-template-columns:1fr}}
a{display:grid;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:18px;color:var(--ink);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent)}
a strong{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-size:22px}
a span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>The Voltas Story Room</h1>
<p>Session 2 · Structured communication. Choose the version for your group.</p>
<div class="links">
<a href="ic.html"><strong>Individual contributors</strong><span>Brief the business partner who needs to act.</span></a>
<a href="managers.html"><strong>Managers</strong><span>Brief a senior stakeholder with a recommendation and an ask.</span></a>
</div>
</main>
</body>
</html>
